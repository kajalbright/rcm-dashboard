function getRecords(m){return state.records[m]||[]}
function filteredRows(m){
  const payer=document.getElementById('payerFilter')?.value||'';
  const provider=document.getElementById('providerFilter')?.value||'';
  const status=document.getElementById('statusFilter')?.value||'';
  const from=document.getElementById('dateFrom')?.value||'';
  const to=document.getElementById('dateTo')?.value||'';
  const q=(document.getElementById('tableSearch')?.value||'').toLowerCase().trim();
  const selected=state.client?.id;
  return getRecords(m).filter(r=>{
    if(hasAllClients() && selected && r.client_id && String(r.client_id)!==String(selected)) return false;
    if(payer && String(r.payer||'').toLowerCase()!==payer.toLowerCase()) return false;
    if(provider && String(r.provider||'').toLowerCase()!==provider.toLowerCase()) return false;
    if(status && String(r.status||'').toLowerCase()!==status.toLowerCase()) return false;
    const date=recordDate(m,r);
    if(from && date && date<from) return false;
    if(to && date && date>to) return false;
    if((from||to) && !date) return false;
    if(q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });
}

    const clientLabel=u.access_all?'All clients':(state.clients.find(c=>c.id===u.client_id)?.name||'—');
    return `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="pill ${u.role==='admin'?'purple':u.role==='user'?'blue':''}">${esc(u.role)}</span></td><td>${esc(clientLabel)}</td><td>${u.active?'<span class="pill green">Active</span>':'<span class="pill red">Disabled</span>'}</td><td><div class="admin-actions"><button class="btn btn-edit btn-small" onclick="openEditUserModal('${u.id}')">Edit</button><button class="btn btn-light btn-small" onclick="toggleUser('${u.id}',${!u.active})">${u.active?'Disable':'Enable'}</button>${String(u.id)!==String(state.session?.user?.id)?`<button class="btn btn-delete btn-small" onclick="deleteUser('${u.id}')">Delete</button>`:''}</div></td></tr>`;
  }).join('')||'<tr><td colspan="6"><div class="empty">No users found.</div></td></tr>';
}
async function toggleUser(id,active){
  if(!canAdmin())return toast('Admin permission required.');
  if(DEMO_MODE){const u=demoUsers.find(x=>x.id===id);if(u)u.active=active;await loadUsers();toast('User status updated');return}
  const {error}=await sb.rpc('app_admin_update_user',{p_user_id:id,p_name:null,p_role:null,p_client_id:null,p_access_all:null,p_active:active});
  if(error)return toast(error.message);
  await audit('user_status_change',{user_id:id,active});await loadUsers();toast('User status updated');
}
function openEditUserModal(id){
  const u=(DEMO_MODE?demoUsers:[]).find(x=>x.id===id);
  if(DEMO_MODE){if(!u)return;showEditUserModal(u);return}
  sb.from('profiles').select('id,name,email,role,client_id,access_all,active').eq('id',id).single().then(({data,error})=>{if(error)return toast(error.message);showEditUserModal(data)});
}
function showEditUserModal(u){
  const opts=state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="editUserModal"><div class="modal"><div class="modal-head"><h3>Edit User Account</h3><button class="btn btn-light btn-small" onclick="closeEditUserModal()">Close</button></div><div class="modal-grid"><div class="field"><label>Full name</label><input id="euName" value="${esc(u.name)}"></div><div class="field"><label>Login email</label><input value="${esc(u.email)}" disabled></div><div class="field"><label>Role</label><select id="euRole"><option value="client">Client — View Only</option><option value="user">User — RCM Operations</option><option value="admin">Admin — Full Access</option></select></div><div class="field"><label>Status</label><select id="euActive"><option value="true">Active</option><option value="false">Disabled</option></select></div><div class="field" style="grid-column:1/-1"><label>Client / Practice Access</label><select id="euClient"><option value="__ALL__">All Clients</option>${opts}</select></div></div><div id="euError"></div><div class="modal-actions"><button class="btn btn-light" onclick="closeEditUserModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser('${u.id}')">Save Changes</button></div></div></div>`);
  document.getElementById('euRole').value=u.role;
  document.getElementById('euActive').value=String(!!u.active);
  document.getElementById('euClient').value=u.access_all?'__ALL__':(u.client_id||'');
  const sync=()=>{const role=document.getElementById('euRole').value,sel=document.getElementById('euClient'),all=sel.querySelector('option[value="__ALL__"]');if(all)all.disabled=role==='client';if(role==='client'&&sel.value==='__ALL__'&&sel.options.length>1)sel.value=sel.options[1].value};
  document.getElementById('euRole').addEventListener('change',sync);sync();
}
function closeEditUserModal(){document.getElementById('editUserModal')?.remove()}
async function saveUser(id){
  const name=document.getElementById('euName').value.trim(),role=document.getElementById('euRole').value,active=document.getElementById('euActive').value==='true',selected=document.getElementById('euClient').value,access_all=selected==='__ALL__',client_id=access_all?null:selected,err=document.getElementById('euError');
  if(!name){err.innerHTML='<div class="error">Name is required.</div>';return}
  if(role==='client'&&access_all){err.innerHTML='<div class="error">Client Viewer must be assigned to one client.</div>';return}
  if(DEMO_MODE){const u=demoUsers.find(x=>x.id===id);if(u)Object.assign(u,{name,role,active,client_id,access_all});closeEditUserModal();await loadUsers();toast('User updated');return}
  const {error}=await sb.rpc('app_admin_update_user',{p_user_id:id,p_name:name,p_role:role,p_client_id:client_id,p_access_all:access_all,p_active:active});
  if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}
  await audit('user_updated',{user_id:id,role,client_id,access_all,active});closeEditUserModal();await loadUsers();toast('User updated successfully');
}
async function deleteUser(id){
  if(!canAdmin())return toast('Admin permission required.');
  if(String(id)===String(state.session?.user?.id))return toast('You cannot delete your own account.');
  if(!confirm('Delete this user permanently? This removes the portal account and cannot be undone.'))return;
  if(DEMO_MODE){const i=demoUsers.findIndex(x=>x.id===id);if(i>=0)demoUsers.splice(i,1);await loadUsers();toast('User deleted');return}
  const {error}=await sb.rpc('app_admin_delete_user',{p_user_id:id});
  if(error)return toast(error.message);
  await audit('user_deleted',{user_id:id});await loadUsers();toast('User deleted successfully');
}

async function loadClientAdmin(){
  const body=document.getElementById('clientsBody');if(!body)return;
  let clients=state.clients;
  if(!DEMO_MODE){
    const {data,error}=await sb.from('clients').select('id,name,specialty,status,created_at').order('created_at',{ascending:false});
    if(error){body.innerHTML=`<tr><td colspan="6">${esc(error.message)}</td></tr>`;return}
    clients=data||[];state.clients=clients;
  }
  let users=[];
  if(DEMO_MODE)users=demoUsers;else{const r=await sb.from('profiles').select('id,client_id');users=r.data||[]}
  body.innerHTML=clients.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.specialty||'—')}</td><td>${c.status==='active'?'<span class="pill green">Active</span>':'<span class="pill red">Inactive</span>'}</td><td>${users.filter(u=>u.client_id===c.id).length}</td><td>${c.created_at?new Date(c.created_at).toLocaleDateString():'—'}</td><td><div class="admin-actions"><button class="btn btn-edit btn-small" onclick="openEditClientModal('${c.id}')">Edit</button><button class="btn btn-delete btn-small" onclick="deleteClient('${c.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No clients yet.</div></td></tr>';
}
function openEditClientModal(id){
  const c=(DEMO_MODE?demoClients.concat(state.clients.filter(x=>!demoClients.some(d=>d.id===x.id))):state.clients).find(x=>x.id===id);
  if(!c)return toast('Client not found.');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="editClientModal"><div class="modal"><div class="modal-head"><h3>Edit Client / Practice</h3><button class="btn btn-light btn-small" onclick="closeEditClientModal()">Close</button></div><div class="field"><label>Practice / Client name</label><input id="ecName" value="${esc(c.name)}"></div><div class="field"><label>Specialty</label><input id="ecSpecialty" value="${esc(c.specialty||'')}"></div><div class="field"><label>Status</label><select id="ecStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div id="ecError"></div><div class="modal-actions"><button class="btn btn-light" onclick="closeEditClientModal()">Cancel</button><button class="btn btn-primary" onclick="saveClient('${c.id}')">Save Changes</button></div></div></div>`);
  document.getElementById('ecStatus').value=c.status||'active';
}
function closeEditClientModal(){document.getElementById('editClientModal')?.remove()}
async function saveClient(id){
  const name=document.getElementById('ecName').value.trim(),specialty=document.getElementById('ecSpecialty').value.trim(),status=document.getElementById('ecStatus').value,err=document.getElementById('ecError');
  if(!name){err.innerHTML='<div class="error">Client name is required.</div>';return}
  if(DEMO_MODE){const c=state.clients.find(x=>x.id===id);if(c)Object.assign(c,{name,specialty,status});closeEditClientModal();await loadClientAdmin();toast('Client updated');return}
  const {data,error}=await sb.rpc('app_admin_update_client',{p_client_id:id,p_name:name,p_specialty:specialty,p_status:status});
  if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}
  await audit('client_updated',{client_id:id,name,specialty,status});await loadClients();closeEditClientModal();await loadClientAdmin();toast('Client updated successfully');
}
async function deleteClient(id){
  if(!canAdmin())return toast('Admin permission required.');
  const c=state.clients.find(x=>x.id===id);
  if(!c)return;
  if(!confirm(`Delete "${c.name}" permanently? All RCM data for this client will also be deleted.`))return;
  if(DEMO_MODE){state.clients=state.clients.filter(x=>x.id!==id);if(state.client?.id===id)state.client=null;await loadClientAdmin();toast('Client deleted');return}
  const {error}=await sb.rpc('app_admin_delete_client',{p_client_id:id});
  if(error)return toast(error.message);
  await audit('client_deleted',{client_id:id,name:c.name});if(state.client?.id===id)state.client=null;await loadClients();await loadData();await loadClientAdmin();toast('Client deleted successfully');
}

function openClientModal(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="clientModal"><div class="modal"><div class="modal-head"><h3>Create Client / Practice</h3><button class="btn btn-light btn-small" onclick="closeClientModal()">Close</button></div><div class="field"><label>Practice / Client name</label><input id="cName" placeholder="Example Medical Group"></div><div class="field"><label>Specialty</label><input id="cSpecialty" placeholder="Physical Therapy / DME / Multi-specialty"></div><div id="cError"></div><div class="modal-actions"><button class="btn btn-light" onclick="closeClientModal()">Cancel</button><button class="btn btn-primary" onclick="createClient()">Create Client</button></div></div></div>`)}
function closeClientModal(){document.getElementById('clientModal')?.remove()}
async function createClient(){if(!canAdmin())return toast('Admin permission required.');const name=document.getElementById('cName').value.trim(),specialty=document.getElementById('cSpecialty').value.trim(),err=document.getElementById('cError');if(!name){err.innerHTML='<div class="error">Client name is required.</div>';return}if(DEMO_MODE){state.clients.push({id:'demo-client-'+Date.now(),name,specialty,status:'active'});closeClientModal();await loadClientAdmin();if(hasAllClients()){const shellEl=document.getElementById('globalClientSelect');if(shellEl)shellEl.innerHTML='<option value="__ALL__">All Clients</option>'+state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');}toast('Demo client created');return}const {data,error}=await sb.from('clients').insert({name,specialty,status:'active'}).select().single();if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}await audit('client_created',{client_id:data.id,name});await loadClients();closeClientModal();await loadClientAdmin();toast('Client created successfully')}

async function deleteImportedData(){
  if(!canAdmin())return toast('Admin permission required.');
  const clientId=document.getElementById('deleteDataClient')?.value,module=document.getElementById('deleteDataModule')?.value,result=document.getElementById('deleteDataResult');
  if(!clientId||!module)return toast('Select client and module.');
  const client=state.clients.find(c=>String(c.id)===String(clientId));
  if(!confirm(`Delete ALL ${module} records for ${client?.name||'this client'}? This cannot be undone.`))return;
  if(result)result.innerHTML='<div class="notice">Deleting data…</div>';
  if(DEMO_MODE){
    state.records[module]=(state.records[module]||[]).filter(r=>String(r.client_id)!==String(clientId));
    if(result)result.innerHTML='<div class="notice">Imported data deleted.</div>';
    toast('Imported data deleted');return;
  }
  const {data,error}=await sb.rpc('app_admin_delete_rcm_module',{p_client_id:clientId,p_module:module});
  if(error){if(result)result.innerHTML=`<div class="notice danger-note">${esc(error.message)}</div>`;return}
  await audit('rcm_data_deleted',{client_id:clientId,module,deleted:data?.deleted??null});
  await loadData();
  if(result)result.innerHTML=`<div class="notice">Deleted ${Number(data?.deleted||0).toLocaleString()} records successfully.</div>`;
  toast('Imported data deleted successfully');
}
async function loadActivity(){const body=document.getElementById('activityBody');if(!body)return;let logs;if(DEMO_MODE)logs=[{created_at:new Date().toISOString(),action:'csv_import',actor:'RCM Operations User',details:'Imported AR CSV'},{created_at:new Date(Date.now()-3600000).toISOString(),action:'login',actor:'Client Viewer',details:'Successful login'}];else{const {data,error}=await sb.from('audit_logs').select('created_at,action,details,actor:actor_id(name)').order('created_at',{ascending:false}).limit(200);if(error){body.innerHTML=`<tr><td colspan="4">${esc(error.message)}</td></tr>`;return}logs=data||[]}body.innerHTML=logs.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${statusPill(x.action)}</td><td>${esc(x.actor?.name||x.actor||'System')}</td><td>${esc(JSON.stringify(x.details||{}))}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">No activity yet.</div></td></tr>'}
async function audit(action,details){if(DEMO_MODE)return;if(state.session?.user)await sb.from('audit_logs').insert({actor_id:state.session.user.id,action,details})}
function openUserModal(){
  const opts=state.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="userModal"><div class="modal"><div class="modal-head"><h3>Create User Account</h3><button class="btn btn-light btn-small" onclick="closeModal()">Close</button></div><div class="modal-grid"><div class="field"><label>Full name</label><input id="uName"></div><div class="field"><label>Login email</label><input id="uEmail" type="email"></div><div class="field"><label>Temporary password</label><input id="uPass" type="password"></div><div class="field"><label>Role</label><select id="uRole"><option value="client">Client — View Only</option><option value="user">User — RCM Operations</option><option value="admin">Admin — Full Access</option></select></div><div class="field" style="grid-column:1/-1"><label>Client / Practice Access</label><select id="uClient"><option value="__ALL__">All Clients</option>${opts}</select><div class="muted" style="margin-top:6px">All Clients is available for Admin and RCM Operations User accounts. Client Viewer accounts must be assigned to one client.</div></div></div><div class="notice">Admin should give the new login credentials to the user securely. For production, enable email/password reset policies in Supabase.</div><div id="uError"></div><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="createUser()">Create Account</button></div></div></div>`);
  const role=document.getElementById('uRole');
  const client=document.getElementById('uClient');
  const syncAccess=()=>{
    const isClient=role.value==='client';
    const all=client.querySelector('option[value="__ALL__"]');
    if(all) all.disabled=isClient;
    if(isClient && client.value==='__ALL__' && client.options.length>1) client.value=client.options[1].value;
    if(!isClient && !client.value) client.value='__ALL__';
  };
  role.addEventListener('change',syncAccess); syncAccess();
}
function closeModal(){document.getElementById('userModal')?.remove()}
async function createUser(){
  const name=document.getElementById('uName').value.trim(),email=document.getElementById('uEmail').value.trim(),password=document.getElementById('uPass').value,role=document.getElementById('uRole').value,selected=document.getElementById('uClient').value,access_all=selected==='__ALL__';
  const client_id=access_all?null:selected;
  const err=document.getElementById('uError');
  if(!name||!email||password.length<8){err.innerHTML='<div class="error">Enter name, valid email and a password of at least 8 characters.</div>';return}
  if(role==='client' && access_all){err.innerHTML='<div class="error">Client Viewer must be assigned to a specific client.</div>';return}
  if(DEMO_MODE){demoUsers.push({id:'demo-'+Date.now(),name,email,role,client_id,access_all,active:true});closeModal();await loadUsers();toast('Demo user created');return}
  const {data,error}=await sb.functions.invoke('admin-create-user',{body:{name,email,password,role,client_id,access_all}});
  if(error||data?.error){err.innerHTML=`<div class="error">${esc(error?.message||data?.error||'Unable to create user')}</div>`;return}
  closeModal();await loadUsers();toast('User created successfully')
}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,err=document.getElementById('loginError');if(DEMO_MODE){const u=demoUsers.find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.active);const pass={admin:'Admin@123',user:'User@123',client:'Client@123'}[u?.role];if(!u||password!==pass){err.innerHTML='<div class="error">Invalid demo credentials.</div>';return}state.session={user:{id:u.id,email:u.email}};state.profile=u;await enterApp();return}const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){err.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}state.session=data.session;await loadProfile();await enterApp()}
async function loadProfile(){const {data,error}=await sb.from('profiles').select('id,name,email,role,client_id,access_all,active').eq('id',state.session.user.id).single();if(error)throw error;if(!data.active)throw new Error('This account is disabled.');state.profile=data}
async function enterApp(){
  try{
    await loadClients();
    if(!state.client&&state.profile.client_id) state.client=state.clients.find(c=>c.id===state.profile.client_id)||null;
    await loadData();
    document.getElementById('app').innerHTML=shell();
    renderSection();
    const selector=document.getElementById('globalClientSelect');
    if(selector) selector.value=state.client?.id||'__ALL__';
  }catch(e){
    document.getElementById('app').innerHTML=loginView();
    const x=document.getElementById('loginError');
    if(x)x.innerHTML=`<div class="error">${esc(e.message||e)}</div>`;
  }
}
async function logout(){if(!DEMO_MODE)await sb.auth.signOut();state={session:null,profile:null,client:null,clients:[],section:'overview',records:{},charts:{},filters:{},demo:DEMO_MODE,dataCapped:false};document.getElementById('app').innerHTML=loginView();bindLogin()}
function bindLogin(){document.getElementById('loginForm')?.addEventListener('submit',e=>{e.preventDefault();login()})}
async function boot(){document.getElementById('app').innerHTML=loginView();bindLogin();if(DEMO_MODE)return;const {data}=await sb.auth.getSession();if(data.session){state.session=data.session;try{await loadProfile();await enterApp()}catch(e){await sb.auth.signOut()}}sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){document.getElementById('app').innerHTML=loginView();bindLogin()}})}
boot();
</script>
</body></html>
