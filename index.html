function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function parseNumericValue(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number')return Number.isFinite(v)?v:null;

  let raw=String(v).trim();
  if(!raw||/^(nan|null|undefined|n\/a|na|none|-)$/i.test(raw))return null;

  // Normalize accounting/currency strings:
  // $2,205.00 / USD 2,205.00 / 2,205.00 USD / (2,205.00) / -$2,205.00
  raw=raw.replace(/\u00A0/g,' ').trim();
  const negativeParens=/^\(.*\)$/.test(raw);
  raw=raw.replace(/^\((.*)\)$/,'$1').trim();
  raw=raw.replace(/[−–—]/g,'-');
  raw=raw.replace(/^\s*(USD|US\$)\s*/i,'');
  raw=raw.replace(/\s*(USD|US\$)\s*$/i,'');
  raw=raw.replace(/[$£€₹]/g,'');
  raw=raw.replace(/,/g,'');
  raw=raw.replace(/\s+/g,'');
  raw=raw.replace(/(CR|DR)$/i,'');

  if(!raw||raw==='-'||raw==='+')return null;
  const n=Number(raw);
  if(!Number.isFinite(n))return null;
  return negativeParens?-Math.abs(n):n;
}

function num(v){
 const n=parseNumericValue(v);
 return n===null?0:n;
}
function money(v){
  const n=parseNumericValue(v);
  if(n===null){
    const raw=String(v??'').trim();
    // Never display "$NaN". If the imported source value is not numeric,
    // show the original value so data is not silently destroyed.
    return raw && !/^(nan|null|undefined)$/i.test(raw) ? esc(raw) : '—';
  }
  return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function normalizeHeader(v){
 return String(v??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[\u2013\u2014]/g,'-').replace(/[^a-z0-9]+/g,'');
}
function cleanExtraKey(v,index){
 const base=String(v??'').replace(/^\uFEFF/,'').trim().replace(/[^a-zA-Z0-9_]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
 return base||`extra_${index+1}`;
}
function prettyLabel(k,m){

}

function normalizeModuleRows(module,rows){
 const s=schemas[module];

 const aliasIndex={};

  [canonical,...names].forEach(n=>{aliasIndex[normalizeHeader(n)]=canonical});

 return rows.map((source,rowIndex)=>{

  const usedKeys=new Set();
  // Walk source headers left-to-right so dashboard order exactly matches file order.
  Object.entries(src).forEach(([rawKey,value],i)=>{
   const originalHeader=String(rawKey??'').replace(/^﻿/,'').trim();
   if(!originalHeader)return;
   const canonical=aliasIndex[normalizeHeader(originalHeader)];
   if(canonical){
     if(usedCanonical.has(canonical))throw new Error(`Duplicate column mapping in row ${rowIndex+2}: "${originalHeader}" maps to ${canonical}.`);

     sourceColumns.push(canonical);
     sourceHeaders[canonical]=originalHeader;
     usedCanonical.add(canonical);
     usedKeys.add(canonical);
     return;
   }
   let key=cleanExtraKey(originalHeader,i);
   while(usedKeys.has(key)||key.startsWith('__'))key=`${key}_${i+1}`;
   usedKeys.add(key);
   d[key]=value??'';
   sourceColumns.push(key);
   sourceHeaders[key]=originalHeader;
  });
  if(!sourceColumns.length)throw new Error(`Row ${rowIndex+2} has no usable columns.`);
  if(!sourceColumns.some(k=>usedCanonical.has(k)))throw new Error(`No supported columns could be mapped for ${modules[module].label}.`);
  const cleanMoney=canonicalizeImportedMoney(module,d);

  cleanMoney.__source_row_index=rowIndex;
  return cleanMoney;
 });
}
function moneyFieldAliases(module){

  };

function repairMoneyFields(module,r){
  const aliases=moneyFieldAliases(module);
  Object.entries(aliases).forEach(([canonical,candidates])=>{
    const current=r[canonical];

    for(const key of candidates){
      if(key===canonical)continue;
      const candidate=r[key];
      if(parseNumericValue(candidate)!==null){
        r[canonical]=candidate;
        break;
      }
    }
  });
  return r;

function canonicalizeImportedMoney(module,r){

 if(Object.prototype.hasOwnProperty.call(r,'id')&&!sourceHasId)delete r.id;
 if(module==='payments'&&/^row-/i.test(String(r.payment_id??'')))delete r.payment_id;

function getRecords(m){return state.records[m]||[]}
function compareSourceOrder(a,b){
  const ab=String(a?.__source_batch_id||''),bb=String(b?.__source_batch_id||'');
  const ai=Number(a?.__source_sequence),bi=Number(b?.__source_sequence);
  if(ab&&bb&&ab===bb){
    if(Number.isFinite(ai)&&Number.isFinite(bi)&&ai!==bi)return ai-bi;
    const ari=Number(a?.__source_row_index),bri=Number(b?.__source_row_index);
    if(Number.isFinite(ari)&&Number.isFinite(bri)&&ari!==bri)return ari-bri;
  }
  const at=String(a?.__imported_at||a?.__db_uploaded_at||''),bt=String(b?.__imported_at||b?.__db_uploaded_at||'');
  if(at&&bt&&at!==bt)return at.localeCompare(bt);
  if(at&&!bt)return 1;
  if(!at&&bt)return -1;
  return 0;
}
function filteredRows(m){
  const payer=document.getElementById('payerFilter')?.value||'';
  const provider=document.getElementById('providerFilter')?.value||'';
  const status=document.getElementById('statusFilter')?.value||'';
  const from=document.getElementById('dateFrom')?.value||'';
  const to=document.getElementById('dateTo')?.value||'';
  const q=(document.getElementById('tableSearch')?.value||'').toLowerCase().trim();
  const selected=state.client?.id;
  const filtered=getRecords(m).filter(r=>{
    if(hasAllClients() && selected && r.client_id && String(r.client_id)!==String(selected)) return false;
    if(payer && String(r.payer||'').toLowerCase()!==payer.toLowerCase()) return false;
    if(provider && String(r.provider||'').toLowerCase()!==provider.toLowerCase()) return false;
    if(status && String(r.status||'').toLowerCase()!==status.toLowerCase()) return false;
    const date=recordDate(m,r);
    if(from && date && date<from) return false;
    if(to && date && date>to) return false;
    if((from||to) && !date) return false;
    if(q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    return true;
  });
  return filtered
    .map((r,index)=>({r,index}))
    .sort((a,b)=>{
      const order=compareSourceOrder(a.r,b.r);
      return order||a.index-b.index;
    })
    .map(x=>x.r);
}

function renderModule(m){

function getFileExtension(file){return String(file?.name||'').toLowerCase().split('.').pop()||''}
function getSchemaHeaderInfo(module,rawRows){
  const s=schemas[module];
  const keys=rawRows.length?Object.keys(rawRows[0]||{}):[];
  const aliasSet=new Set();
  Object.entries(s.aliases||{}).forEach(([canonical,names])=>[canonical,...names].forEach(n=>aliasSet.add(normalizeHeader(n))));
  const recognized=keys.filter(k=>aliasSet.has(normalizeHeader(k)));
  const normalizedKeys=keys.map(normalizeHeader).filter(Boolean);
  const joined=normalizedKeys.join('');
  const knownHeaders=Object.keys(s.aliases||{}).flatMap(k=>[k,...(s.aliases[k]||[])]).map(normalizeHeader);
  const suspiciousTokens=knownHeaders.filter(h=>h.length>=5 && joined.includes(h));
  const duplicateNormalized=new Set();
  const duplicates=[];
  const canonicalSeen=new Map();
  const aliasCollisions=[];
  for(const k of keys){
    const n=normalizeHeader(k);
    if(!n)continue;
    if(duplicateNormalized.has(n))duplicates.push(k);
    duplicateNormalized.add(n);
    const canonical=aliasSet.has(n)?Object.entries(s.aliases||{}).find(([c,names])=>[c,...names].some(x=>normalizeHeader(x)===n))?.[0]:null;
    if(canonical){
      if(canonicalSeen.has(canonical))aliasCollisions.push({header:k,canonical});
      else canonicalSeen.set(canonical,k);
    }
  }
  return {keys,recognized,duplicates,aliasCollisions,suspiciousTokens};
}
function validateImportStructure(module,rawRows,fileName){
  const s=schemas[module];
  if(!s)throw new Error(`Unsupported module: ${module}`);
  if(!Array.isArray(rawRows)||!rawRows.length)throw new Error('No data rows found. Make sure the first row contains column names.');
  const info=getSchemaHeaderInfo(module,rawRows);
  if(!info.keys.length)throw new Error('No column headers were detected. The first row must contain column names.');
  if(info.duplicates.length)throw new Error(`Duplicate column header detected: ${info.duplicates[0]}. Rename duplicate columns and try again.`);
  if(info.aliasCollisions.length)throw new Error(`Multiple headers map to the same field (${info.aliasCollisions[0].canonical}). Keep only one matching column and try again.`);
  const nonEmptyHeaders=info.keys.filter(k=>String(k??'').trim()!=='');
  if(nonEmptyHeaders.length<2)throw new Error('The file contains too few columns. Please check that the header row is correct.');
  // A common failure mode is a header accidentally concatenated into one field, e.g. payerDate of Servicebalance...
  if(info.keys.length<=2 && info.suspiciousTokens.length>=3){
    throw new Error(`The header row appears malformed or concatenated. Example detected in ${fileName||'the file'}. Please export the sheet again with separate columns.`);
  }
  if(info.recognized.length===0){
    throw new Error(`No supported column headers were recognized for ${modules[module].label}. Use the Download Template button or rename the headers before importing.`);
  }
  if(info.recognized.length<Math.min(2,s.headers.length)){
    throw new Error(`Only ${info.recognized.length} supported column(s) were recognized for ${modules[module].label}. Import stopped to prevent column misalignment.`);
  }
}
async function parseImportFile(file,module){
  const ext=getFileExtension(file);
  if(!['csv','xlsx','xls'].includes(ext))throw new Error('Unsupported file. Please upload CSV, XLSX, or XLS.');
  if(file.size===0)throw new Error('The selected file is empty.');
  if(file.size>25*1024*1024)throw new Error('Maximum file size is 25 MB. Split the file into smaller uploads.');

  let rawRows=[];
  let sourceName=file.name||'file';
  if(['xlsx','xls'].includes(ext)){
    if(typeof XLSX==='undefined')throw new Error('Excel reader is unavailable. Please refresh the page and try again.');
    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array',cellDates:false,raw:false});
    if(!workbook.SheetNames?.length)throw new Error('No worksheet was found in the Excel file.');
    let sheetName='';
    for(const name of workbook.SheetNames){
      const sheet=workbook.Sheets[name];
      const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',blankrows:false,raw:false});
      if(matrix.some(row=>Array.isArray(row)&&row.some(v=>String(v??'').trim()!==''))){sheetName=name;break;}
    }
    if(!sheetName)throw new Error('All worksheets in the Excel file are empty.');
    sourceName=`${file.name} — sheet: ${sheetName}`;
    rawRows=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{defval:'',blankrows:false,raw:false});
  }else{
    rawRows=await new Promise((resolve,reject)=>{
      Papa.parse(file,{
        header:true,
        skipEmptyLines:'greedy',
        transformHeader:h=>String(h??'').replace(/^\uFEFF/,'').trim(),
        delimitersToGuess:[',','\t',';','|'],
        complete:r=>{
          if(r.errors?.length){
            const first=r.errors[0];
            reject(new Error(first.message||'CSV parsing failed. Please check the delimiter and column structure.'));
            return;
          }
          resolve(r.data||[]);
        },
        error:e=>reject(new Error(e.message||'CSV parsing failed.'))
      });
    });
  }
  rawRows=rawRows.filter(row=>Object.values(row||{}).some(v=>String(v??'').trim()!==''));
  if(!rawRows.length)throw new Error('No usable data rows were found.');
  if(rawRows.length>50000)throw new Error('Maximum 50,000 rows per import. Split the file into smaller imports.');
  validateImportStructure(module,rawRows,sourceName);
  return {rows:normalizeModuleRows(module,rawRows),sourceName,ext};
}
async function importCsv(){

  const button=document.getElementById('startImport');
  if(button){button.disabled=true;button.textContent='Processing…';}
  try{
    const parsed=await parseImportFile(file,module);
    const rows=parsed.rows;
    if(!rows.length)throw new Error('No records could be mapped from the file.');
    const clientId=hasAllClients()?(document.getElementById('importClient')?.value||state.clients[0]?.id):state.profile?.client_id;
    if(!clientId)throw new Error('No client is assigned to this account.');
    const allowedClient=state.clients.some(c=>String(c.id)===String(clientId));
    if(!allowedClient)throw new Error('Selected client is not available to your account.');
    const mode=document.getElementById('importMode')?.value||'append';
    if(!['replace','append'].includes(mode))throw new Error('Invalid import mode.');

    if(DEMO_MODE){
      const importedAt=new Date().toISOString();
      const demoRows=rows.map((r,index)=>({...r,client_id:clientId,__source_row_index:Number.isFinite(Number(r?.__source_row_index))?Number(r.__source_row_index):index,__imported_at:importedAt}));
      if(mode==='replace')state.records[module]=demoRows;
      else state.records[module]=[...getRecords(module),...demoRows];
      result.innerHTML=`<div class="notice">Validated and imported ${rows.length.toLocaleString()} records from ${esc(parsed.sourceName)} in demo mode.</div>`;
      toast('File imported successfully');
      return;
    }
    const response=await insertRecords(module,rows,clientId,mode);
    result.innerHTML=`<div class="notice">Validated and imported ${rows.length.toLocaleString()} records from ${esc(parsed.sourceName)} successfully.</div>`;
    if(response?.import_batch_id)result.innerHTML+=`<div class="muted" style="margin-top:6px">Import batch: ${esc(response.import_batch_id)}</div>`;
    await loadData();
    toast('File imported successfully');
  }catch(e){
    if(result)result.innerHTML=`<div class="notice danger-note">${esc(e.message||e)}</div>`;
  }finally{
    if(button){button.disabled=false;button.textContent='Import File';}
  }
}
async function insertRecords(module,rows,clientId,mode){
  if(!state.session?.user?.id)throw new Error('Your session has expired. Please sign in again.');
  if(!clientId)throw new Error('A client is required for import.');
  if(!['admin','user'].includes(getRole()))throw new Error('You do not have permission to import data.');
  if(!schemas[module])throw new Error('Invalid RCM module.');
  if(!['replace','append'].includes(mode))throw new Error('Invalid import mode.');
  if(!Array.isArray(rows)||!rows.length)throw new Error('No records to import.');
  if(rows.length>50000)throw new Error('Maximum 50,000 rows per import.');
  const batchId=crypto.randomUUID?.()||`batch-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const importedAt=new Date().toISOString();

  // external_id is database metadata only. It is never added to `data`, so it
  // cannot create an extra visible Row ID column in the portal.
  const naturalIdKeys=['claim_id','payment_id','authnum','patient_id'];
  const payload=rows.map((r,index)=>{
    // IMPORTANT: external_id is the stable, non-visible source-order key.
    // Never use a business field such as claim_id/payment_id here: doing so
    // makes the database free to return rows in an arbitrary order and can
    // break when the same business ID appears in another upload.
    const sourceIndex=Number.isFinite(Number(r?.__source_row_index))?Number(r.__source_row_index):index;
    const data={
      ...r,
      __source_row_index:sourceIndex,
      __imported_at:importedAt,
      __source_batch_id:batchId
    };
    const sequence=String(sourceIndex+1).padStart(8,'0');
    return {external_id:`${batchId}:${sequence}`,data};
  });
  const {data,error}=await sb.rpc('app_import_rcm_records',{p_client_id:clientId,p_module:module,p_mode:mode,p_rows:payload,p_import_batch_id:batchId});
  if(error)throw new Error(error.message||'Import failed.');
  await audit('csv_import',{module,client_id:clientId,rows:rows.length,mode,batch_id:batchId,file_type:'csv_or_excel'});
  if(data&&typeof data==='object'&&!data.import_batch_id)data.import_batch_id=batchId;
  return data||{import_batch_id:batchId};
}
function downloadTemplate(){const m=document.getElementById('importModule').value,s=schemas[m],headers=s.csvHeaders||s.headers;let sample=[];if(m==='ar')sample=['2026-09-25','CLM-1001','John Doe','PAT-1001','Dr. Sharma','Medicare','2026-09-20','4200','25','0-30','Pending'];else if(m==='denials')sample=['2026-09-25','CLM-2001','John Doe','PAT-2001','Dr. Sharma','Medicare','2026-09-20','99214','1200','1200','CO-16','Open','Review documentation'];else sample=headers.map((_,i)=>i===0?'DEMO-001':'');const escCsv=v=>{const x=String(v??'');return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};const csv=headers.join(',')+'\n'+sample.map(escCsv).join(',')+'\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${m}_template.csv`;a.click();URL.revokeObjectURL(a.href)}
async function loadData(){
  if(DEMO_MODE){
    state.records=demoData();
    state.dataCapped=false;
    const selected=state.client?.id;
    if(selected){
      // Demo data belongs to the demo client; keep it visible when that client is selected.
    }
    return;
  }
  let q=sb.from('rcm_records').select('id,client_id,module,external_id,data,uploaded_at,import_batch_id');
  if(!hasAllClients()) q=q.eq('client_id',state.profile.client_id);
  else if(state.client?.id) q=q.eq('client_id',state.client.id);
  const {data,error}=await q.order('uploaded_at',{ascending:false}).limit(20001);
  if(error)throw error;
  state.dataCapped=(data||[]).length>20000;
  const source=(data||[]).slice(0,20000);
  state.records={};
  source.forEach(r=>{
    const clean=sanitizeStoredRecord(r.module,r.data);
    const hydrated=hydrateRecordFromDatabase(r.module,clean,r.external_id);
    if(!hydrated.__db_uploaded_at && r.uploaded_at)hydrated.__db_uploaded_at=r.uploaded_at;
    if(!hydrated.__imported_at && r.uploaded_at)hydrated.__imported_at=r.uploaded_at;
    if(!hydrated.__source_batch_id && r.import_batch_id)hydrated.__source_batch_id=String(r.import_batch_id);
    if(!hydrated.__source_batch_id && hydrated.__external_id){
      const batch=String(hydrated.__external_id).split(':')[0];
      if(batch)hydrated.__source_batch_id=batch;
    }
    (state.records[r.module]??=[]).push({...hydrated,client_id:r.client_id});
  });

  // Never sort by claim ID, payer, date, balance, etc. Those would change the
  // source row order. Only use the internal import sequence when available.
  Object.keys(state.records).forEach(m=>{
    state.records[m]=state.records[m].map((r,index)=>({r,index}))
      .sort((a,b)=>compareSourceOrder(a.r,b.r)||a.index-b.index)
      .map(x=>x.r);
  });
}

async function logout(){if(!DEMO_MODE)await sb.auth.signOut();state={session:null,profile:null,client:null,clients:[],section:'overview',records:{},charts:{},filters:{},demo:DEMO_MODE,dataCapped:false};document.getElementById('app').innerHTML=loginView();bindLogin()}
function bindLogin(){document.getElementById('loginForm')?.addEventListener('submit',e=>{e.preventDefault();login()})}
async function boot(){document.getElementById('app').innerHTML=loginView();bindLogin();if(DEMO_MODE)return;const {data}=await sb.auth.getSession();if(data.session){state.session=data.session;try{await loadProfile();await enterApp()}catch(e){await sb.auth.signOut()}}sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){document.getElementById('app').innerHTML=loginView();bindLogin()}})}
boot();
</script>
</body></html>
