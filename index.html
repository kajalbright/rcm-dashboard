function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function parseNumericValue(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number')return Number.isFinite(v)?v:null;

  let raw=String(v).trim();
  if(!raw||/^(nan|null|undefined|n\/a|na|none|-)$/i.test(raw))return null;

  // Normalize accounting/currency strings:
  // $2,205.00 / USD 2,205.00 / 2,205.00 USD / (2,205.00) / -$2,205.00
  raw=raw.replace(/\u00A0/g,' ').trim();
  const negativeParens=/^\(.*\)$/.test(raw);
  raw=raw.replace(/^\((.*)\)$/,'$1').trim();
  raw=raw.replace(/[−–—]/g,'-');
  raw=raw.replace(/^\s*(USD|US\$)\s*/i,'');
  raw=raw.replace(/\s*(USD|US\$)\s*$/i,'');
  raw=raw.replace(/[$£€₹]/g,'');
  raw=raw.replace(/,/g,'');
  raw=raw.replace(/\s+/g,'');
  raw=raw.replace(/(CR|DR)$/i,'');

  if(!raw||raw==='-'||raw==='+')return null;
  const n=Number(raw);
  if(!Number.isFinite(n))return null;
  return negativeParens?-Math.abs(n):n;
}

function num(v){
 const n=parseNumericValue(v);
 return n===null?0:n;
}
function money(v){
  const n=parseNumericValue(v);
  if(n===null){
    const raw=String(v??'').trim();
    // Never display "$NaN". If the imported source value is not numeric,
    // show the original value so data is not silently destroyed.
    return raw && !/^(nan|null|undefined)$/i.test(raw) ? esc(raw) : '—';
  }
  return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function normalizeHeader(v){
 return String(v??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[\u2013\u2014]/g,'-').replace(/[^a-z0-9]+/g,'');
}
function cleanExtraKey(v,index){
 const base=String(v??'').replace(/^\uFEFF/,'').trim().replace(/[^a-zA-Z0-9_]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase();
 return base||`extra_${index+1}`;
}
function prettyLabel(k,m){

}

function normalizeModuleRows(module,inputRows){
 const schema=schemas[module];
 if(!schema)throw new Error(`Unsupported module: ${module}`);
 const aliasIndex={};
 Object.entries(schema.aliases||{}).forEach(([canonical,names])=>{
   [canonical,...(names||[])].forEach(name=>{aliasIndex[normalizeHeader(name)]=canonical});
 });
 return (inputRows||[]).map((sourceRecord,sourceIndex)=>{
   const src=(sourceRecord&&typeof sourceRecord==='object')?sourceRecord:{};
   const output={};
   const sourceColumns=[];
   const sourceHeaders={};
   const usedCanonical=new Set();
   const usedKeys=new Set();
   const rawHeaderList=Array.isArray(src.__raw_source_headers)?src.__raw_source_headers:null;
   Object.entries(src).forEach(([rawKey,value],columnIndex)=>{
     if(String(rawKey).startsWith('__'))return;
     const originalHeader=String(rawHeaderList?.[columnIndex]??rawKey??'').replace(/^﻿/,'').trim();
     if(!originalHeader)return;
     const canonical=aliasIndex[normalizeHeader(originalHeader)];
     if(canonical&&!usedCanonical.has(canonical)){
       output[canonical]=value??'';
       sourceColumns.push(canonical);
       sourceHeaders[canonical]=originalHeader;
       usedCanonical.add(canonical);
       usedKeys.add(canonical);
       return;
     }
     let key=cleanExtraKey(originalHeader,columnIndex);
     if(!key)key=`column_${columnIndex+1}`;
     while(usedKeys.has(key)||key.startsWith('__'))key=`${key}_${columnIndex+1}`;
     usedKeys.add(key);
     output[key]=value??'';
     sourceColumns.push(key);
     sourceHeaders[key]=originalHeader;
   });
   if(!sourceColumns.length)throw new Error(`Source record ${sourceIndex+2} has no usable columns.`);
   const normalized=canonicalizeImportedMoney(module,output);
   normalized.__source_columns=sourceColumns;
   normalized.__source_headers=sourceHeaders;
   const explicitIndex=Number(sourceRecord?.__raw_source_row_index);
   normalized.__source_row_index=Number.isFinite(explicitIndex)?explicitIndex:sourceIndex;
   return normalized;
 });
}
function moneyFieldAliases(module){

    posted_amount:['posted_amount','postedAmount','amount_posted','payment_posted'],

  };
  if(module==='payments')return {total_deposit_amount:common.total_deposit_amount,posted_amount:common.posted_amount};
  if(module==='ar'||module==='denials')return {balance:common.balance};
  if(module==='charges')return {charge:common.charge};
  return {};
}
function repairMoneyFields(module,r){
  const aliases=moneyFieldAliases(module);
  Object.entries(aliases).forEach(([canonical,candidates])=>{
    const current=r[canonical];
    if(parseNumericValue(current)!==null)return;
    for(const key of candidates){
      if(key===canonical)continue;
      const candidate=r[key];
      if(parseNumericValue(candidate)!==null){
        r[canonical]=candidate;
        break;
      }
    }
  });
  return r;
}
function canonicalizeImportedMoney(module,r){
  const out={...r};
  const fields=[...(moneyFields||[])];
  fields.forEach(k=>{
    if(!Object.prototype.hasOwnProperty.call(out,k))return;
    const n=parseNumericValue(out[k]);
    if(n!==null)out[k]=n;
  });
  return out;
}

 const map=legacyMap[module]||{};
 Object.entries(map).forEach(([legacy,canonical])=>{

 repairMoneyFields(module,r);

 ['row_id','rowId','external_id','externalId','_id','source_columns','sourceColumns','source_file','sourceFile','import_batch_id','importBatchId'].forEach(k=>{if(Object.prototype.hasOwnProperty.call(r,k))delete r[k]});
 if(Object.prototype.hasOwnProperty.call(r,'id')&&!sourceHasId)delete r.id;
 if(module==='payments'&&/^row-/i.test(String(r.payment_id??'')))delete r.payment_id;
 if(module==='charges'&&/^row-/i.test(String(r.claim_id??'')))delete r.claim_id;

async function commRefreshUnread(){
  if(DEMO_MODE||!state.session?.user)return;
  const clients=commClients(); if(!clients.length)return;
  try{
    for(const c of clients){
      const w=String(c.id);
      const {data:read,error:readError}=await sb.from('communication_reads').select('last_read_at').eq('client_id',w).eq('user_id',state.session.user.id).maybeSingle();
      if(readError)continue;
      const {count,error}=await sb.from('communication_messages').select('id',{count:'exact',head:true}).eq('client_id',w).neq('sender_id',state.session.user.id).gt('created_at',read?.last_read_at||'1970-01-01T00:00:00Z');
      if(!error){ensureCommState();state.commUnread[w]=count||0;}
    }
  }catch(e){console.warn('Unread refresh failed',e)}
}

async function renderCommunication(){

      ensureCommState();state.commUnread[w]=0;
      body.innerHTML=`<div class="comm-layout ${['admin','user'].includes(commRole())?'with-rail':''}">${clientRail}<section class="comm-panel comm-chat"><header><div><strong>${esc(name)}</strong><span>BHA ↔ Client conversation</span></div><span class="comm-secure">Production workspace</span></header><div class="comm-message-list" id="commMessages">${msgs?.length?msgs.map(m=>`<div class="comm-message ${String(m.sender_id)===String(state.session.user.id)?'mine':''}" data-message-id="${esc(m.id)}"><div>${esc(m.message)}</div><small>${esc(m.sender_name||String(m.sender_role||'User').toUpperCase())} · ${new Date(m.created_at).toLocaleString()}</small></div>`).join(''):'<div class="comm-empty">No messages yet. Start a conversation below.</div>'}</div><footer><textarea id="commText" maxlength="2000" placeholder="Write a message…"></textarea><button class="btn btn-primary btn-small" id="commSend">Send</button></footer></section></div>`;
      const list=document.getElementById('commMessages');if(list)list.scrollTop=list.scrollHeight;

    }else{
      state.commTab='messages';
      return void renderCommunication();

function compareSourceOrder(a,b){

    if(Number.isFinite(ari)&&Number.isFinite(bri)&&ari!==bri)return ari-bri;

  if(at&&bt&&at!==bt)return at.localeCompare(bt);

 const el=document.createElement('div');el.className='v6-copy-note';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1600)
}
function bindV6ModuleExtras(m){
 const clear=document.getElementById('v6ClearFilters');
 if(clear)clear.onclick=()=>{state.filters[m]={};state.quickAge='';state.tablePage=1;renderModule(m)};
 const table=document.getElementById('dataTable');
 if(table&&!table.dataset.v6CopyBound){
   table.dataset.v6CopyBound='1';
   table.addEventListener('dblclick',async e=>{
     const tr=e.target.closest('tbody tr');if(!tr)return;
     const cells=[...tr.querySelectorAll('td')];
     if(!cells.length)return;
     const txt=cells.map(td=>td.innerText.trim()).join('\t');
     if(!txt)return;
     try{
       if(navigator.clipboard?.writeText&&window.isSecureContext){await navigator.clipboard.writeText(txt)}
       else{
         const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
         document.body.appendChild(ta);ta.focus();ta.select();
         const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed');
       }
       v6CopyToast('Row copied to clipboard');
     }catch(_){/* Optional convenience only: silently ignore if local browser blocks clipboard. */}
   });
 }
}

function renderModule(m){
  let rows=filteredRows(m),table=document.getElementById('dataTable');if(!table)return;
  renderModuleSummary(m,rows);
  paintFilterStatus();
  const summaryNode=document.getElementById('moduleSummary');if(summaryNode&&rows.length)summaryNode.insertAdjacentHTML('beforeend',moduleHealthHtml(m,rows));
  const fresh=document.getElementById('moduleFreshness');if(fresh)fresh.innerHTML=`Updated <b>${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</b>`;
  document.getElementById('v3Ops')?.remove();

  if(summaryHost){const holder=document.createElement('div');holder.id='v3Ops';holder.innerHTML=(m==='ar'?arOpsHtml(rows):'')+moduleInsightsHtml(m,rows);summaryHost.insertAdjacentElement('afterend',holder);if(m==='ar')bindQuickFocus()}
  // Source-faithful table contract:
  // Detailed Records mirrors the imported spreadsheet structure instead of a hard-coded module layout.
  // Keep every imported column (including fully blank columns) and preserve original source order/header text.
  const sourceRows=rows.filter(r=>Array.isArray(r?.__source_columns)&&r.__source_columns.length);
  const sourceRow=sourceRows[0]||rows[0]||{};
  const cols=[];const seenCols=new Set();
  sourceRows.forEach(r=>sourceColumnKeys(m,r).forEach(c=>{if(!seenCols.has(c)){seenCols.add(c);cols.push(c)}}));
  if(!cols.length)sourceColumnKeys(m,sourceRow).forEach(c=>{if(!seenCols.has(c)){seenCols.add(c);cols.push(c)}});
  // Preserve upload/source row order by default. Sorting is only applied after the user explicitly clicks a column.
  if(state.tableSort?.key)rows=sortRows(rows);
  const pageSize=state.tablePageSize||50,totalPages=Math.max(1,Math.ceil(rows.length/pageSize));
  state.tablePage=Math.min(Math.max(1,state.tablePage||1),totalPages);
  const from=(state.tablePage-1)*pageSize,shown=rows.slice(from,from+pageSize);
  const label=k=>{const owner=sourceRows.find(r=>r?.__source_headers&&Object.prototype.hasOwnProperty.call(r.__source_headers,k))||sourceRow;return sourceHeaderLabel(owner,k)};
  const mark=c=>state.tableSort?.key===c?`<span class="sort-mark">${state.tableSort.dir==='asc'?'▲':'▼'}</span>`:'';
  table.innerHTML=`<thead><tr>${cols.map(c=>`<th class="sortable" data-sort="${esc(c)}">${esc(label(c))}${mark(c)}</th>`).join('')}</tr></thead><tbody>${shown.map(r=>`<tr>${cols.map(c=>{const raw=r[c],val=moneyFields.has(c)?money(raw):String(raw??'');let cls='';if(m==='ar'&&c==='days'){const d=Number(raw||0);cls=d>120?'row-risk':d>90?'row-warn':''}return `<td class="${cls}" title="${esc(String(raw??''))}">${esc(val)}</td>`}).join('')}</tr>`).join('')}</tbody>`;
  if(!rows.length)table.innerHTML=`<tbody><tr><td><div class="module-empty"><strong>No records match this view</strong>Adjust the filters or select another client workspace.</div></td></tr></tbody>`;
  const meta=document.getElementById('tableMeta');if(meta){const selectedClientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null),scope=selectedClientId?`client:${selectedClientId}`:'all:authorized',loading=v14LoadingModules.get(`${scope}|${m}`);meta.innerHTML=`<b>${rows.length.toLocaleString()}</b> ${loading?'loaded so far':'filtered records'} · rows <b>${rows.length?(from+1).toLocaleString():0}–${Math.min(from+shown.length,rows.length).toLocaleString()}</b>${loading?' <span class="v14-loading-dot">• loading remaining records</span>':''}`;}
  let pager=document.getElementById('tablePager');const wrap=table.closest('.table-wrap');if(!pager&&wrap){pager=document.createElement('div');pager.id='tablePager';pager.className='pagination';wrap.insertAdjacentElement('afterend',pager)}
  if(pager)pager.innerHTML=`<span>Page <b>${state.tablePage}</b> of <b>${totalPages}</b> · <select id="pageSizeSelect" class="pager-select"><option value="50" ${pageSize===50?'selected':''}>50</option><option value="100" ${pageSize===100?'selected':''}>100</option><option value="250" ${pageSize===250?'selected':''}>250</option></select> rows/page</span><div class="pagination-actions"><button id="prevPage" ${state.tablePage<=1?'disabled':''}>← Previous</button><button id="nextPage" ${state.tablePage>=totalPages?'disabled':''}>Next →</button></div>`;
  document.getElementById('prevPage')?.addEventListener('click',()=>{if(state.tablePage>1){state.tablePage--;renderModule(m)}});
  document.getElementById('nextPage')?.addEventListener('click',()=>{if(state.tablePage<totalPages){state.tablePage++;renderModule(m)}});
  document.getElementById('pageSizeSelect')?.addEventListener('change',e=>{state.tablePageSize=Number(e.target.value)||100;state.tablePage=1;renderModule(m)});
  table.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{const key=th.dataset.sort;if(state.tableSort?.key===key)state.tableSort.dir=state.tableSort.dir==='asc'?'desc':'asc';else state.tableSort={key,dir:'asc'};state.tablePage=1;renderModule(m)});
  if(!table.dataset.enhanced){table.dataset.enhanced='1';requestAnimationFrame(enhanceVisibleTables)}
}

    return {summary:{total_ar:sum(ar,'balance'),ar_claims:ar.length,denial_count:den.length,open_denials:den.filter(r=>/open/i.test(r.status)).length,posting_rate:sum(pay,'total_deposit_amount')?sum(pay,'posted_amount')/sum(pay,'total_deposit_amount')*100:null,denial_amount:sum(den,'balance'),posted_amount:sum(pay,'posted_amount'),total_deposits:sum(pay,'total_deposit_amount'),payment_records:pay.length},aging:[]};
  }
  const ids=state.client?.id?[state.client.id]:state.clients.map(c=>c.id);if(!ids.length)return {summary:dashboardSummaryZero(),aging:[]};
  const one=async id=>{const ck=`bha_exec_client_v14_${id}`;try{const c=JSON.parse(sessionStorage.getItem(ck)||'null');if(c&&Date.now()-c.savedAt<300000)return c.data}catch(_){}const [sr,ar]=await Promise.all([sb.rpc('app_dashboard_summary',{p_client_id:id}),sb.rpc('app_dashboard_ar_aging',{p_client_id:id})]);if(sr.error)throw sr.error;if(ar.error)throw ar.error;const data={summary:sr.data||dashboardSummaryZero(),aging:ar.data||[]};try{sessionStorage.setItem(ck,JSON.stringify({savedAt:Date.now(),data}))}catch(_){}return data};
  const withTimeout=(promise,ms=7000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Dashboard request timed out')),ms))]);

function getFileExtension(file){return String(file?.name||'').toLowerCase().split('.').pop()||''}
function getSchemaHeaderInfo(module,rawRows){
  const s=schemas[module];
  const keys=rawRows.length?Object.keys(rawRows[0]||{}):[];
  const aliasSet=new Set();
  Object.entries(s.aliases||{}).forEach(([canonical,names])=>[canonical,...names].forEach(n=>aliasSet.add(normalizeHeader(n))));
  const recognized=keys.filter(k=>aliasSet.has(normalizeHeader(k)));
  const normalizedKeys=keys.map(normalizeHeader).filter(Boolean);
  const joined=normalizedKeys.join('');
  const knownHeaders=Object.keys(s.aliases||{}).flatMap(k=>[k,...(s.aliases[k]||[])]).map(normalizeHeader);
  const suspiciousTokens=knownHeaders.filter(h=>h.length>=5 && joined.includes(h));
  const duplicateNormalized=new Set();
  const duplicates=[];
  const canonicalSeen=new Map();
  const aliasCollisions=[];
  for(const k of keys){
    const n=normalizeHeader(k);
    if(!n)continue;
    if(duplicateNormalized.has(n))duplicates.push(k);
    duplicateNormalized.add(n);
    const canonical=aliasSet.has(n)?Object.entries(s.aliases||{}).find(([c,names])=>[c,...names].some(x=>normalizeHeader(x)===n))?.[0]:null;
    if(canonical){
      if(canonicalSeen.has(canonical))aliasCollisions.push({header:k,canonical});
      else canonicalSeen.set(canonical,k);
    }
  }
  return {keys,recognized,duplicates,aliasCollisions,suspiciousTokens};
}
function validateImportStructure(module,rawRows,fileName){
  const s=schemas[module];
  if(!s)throw new Error(`Unsupported module: ${module}`);
  if(!Array.isArray(rawRows)||!rawRows.length)throw new Error('No data rows found. Make sure the first row contains column names.');
  const info=getSchemaHeaderInfo(module,rawRows);
  if(!info.keys.length)throw new Error('No column headers were detected. The first row must contain column names.');
  if(info.duplicates.length)throw new Error(`Duplicate column header detected: ${info.duplicates[0]}. Rename duplicate columns and try again.`);
  // Multiple differently-named source columns may map to one analytics field.
  // The first powers analytics; subsequent columns are preserved exactly in Detailed Records.
  const nonEmptyHeaders=info.keys.filter(k=>String(k??'').trim()!=='');
  if(nonEmptyHeaders.length<2)throw new Error('The file contains too few columns. Please check that the header row is correct.');
  // A common failure mode is a header accidentally concatenated into one field, e.g. payerDate of Servicebalance...
  if(info.keys.length<=2 && info.suspiciousTokens.length>=3){
    throw new Error(`The header row appears malformed or concatenated. Example detected in ${fileName||'the file'}. Please export the sheet again with separate columns.`);
  }
  if(info.recognized.length===0){
    // Source-exact fallback: operational exports often use practice-specific headers.
    // Preserve every source column instead of blocking the upload. Analytics fields
    // populate whenever aliases are recognized; otherwise Detailed Records still remain usable.
    console.warn(`No standard analytics headers recognized for ${modules[module].label}; importing source-exact columns.`);
  }
  // One recognized operational field is enough to safely scope the dataset.
  // All additional source columns are retained even when they are not analytics fields.
}

function sourceMatrixToRows(matrix){
  if(!Array.isArray(matrix)||!matrix.length)throw new Error('No rows were found in the file.');
  const width=Math.max(...matrix.map(r=>Array.isArray(r)?r.length:0),0);
  if(width<2)throw new Error('Only one column was detected. Check the file delimiter or worksheet structure.');
  const rawHeaders=Array.from({length:width},(_,i)=>{
    const v=String(matrix[0]?.[i]??'').replace(/^\uFEFF/,'').trim();
    return v||`Column ${i+1}`;
  });
  const seen=new Map();
  const headers=rawHeaders.map((h,i)=>{
    const n=normalizeHeader(h)||`column${i+1}`;
    const count=(seen.get(n)||0)+1;seen.set(n,count);
    return count===1?h:`${h} (${count})`;
  });
  const rows=matrix.slice(1).map((row,rowIndex)=>{
    const obj={};
    headers.forEach((h,i)=>{obj[h]=row?.[i]??''});
    Object.defineProperty(obj,'__raw_source_headers',{value:rawHeaders,enumerable:false,configurable:true});
    Object.defineProperty(obj,'__raw_source_row_index',{value:rowIndex,enumerable:false,configurable:true});
    return obj;
  });
  return {rows,rawHeaders,width};
}

async function parseImportFile(file,module){
  const ext=getFileExtension(file);
  if(!['csv','xlsx','xls'].includes(ext))throw new Error('Unsupported file. Please upload CSV, XLSX, or XLS.');
  if(file.size===0)throw new Error('The selected file is empty.');
  if(file.size>25*1024*1024)throw new Error('Maximum file size is 25 MB. Split the file into smaller uploads.');

  let rawRows=[];
  let sourceName=file.name||'file';
  if(['xlsx','xls'].includes(ext)){
    if(typeof XLSX==='undefined')throw new Error('Excel reader is unavailable. Please refresh the page and try again.');
    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array',cellDates:false,raw:false});
    if(!workbook.SheetNames?.length)throw new Error('No worksheet was found in the Excel file.');
    let sheetName='';
    for(const name of workbook.SheetNames){
      const sheet=workbook.Sheets[name];
      const matrix=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',blankrows:false,raw:false});
      if(matrix.some(row=>Array.isArray(row)&&row.some(v=>String(v??'').trim()!==''))){sheetName=name;break;}
    }
    if(!sheetName)throw new Error('All worksheets in the Excel file are empty.');
    sourceName=`${file.name} — sheet: ${sheetName}`;
    const matrix=XLSX.utils.sheet_to_json(workbook.Sheets[sheetName],{header:1,defval:'',blankrows:false,raw:false});
    rawRows=sourceMatrixToRows(matrix).rows;
  }else{
    if(typeof Papa==='undefined')throw new Error('CSV reader is unavailable. Please refresh the page and try again.');
    const buffer=await file.arrayBuffer();
    const bytes=new Uint8Array(buffer);
    let encoding='utf-8';
    if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE)encoding='utf-16le';
    else if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF)encoding='utf-16be';
    let text;
    try{text=new TextDecoder(encoding).decode(buffer)}catch(_){text=new TextDecoder('utf-8').decode(buffer)}
    text=String(text||'').replace(/^\uFEFF/,'');
    if(!text.trim())throw new Error('The selected CSV file is empty.');
    const parsed=Papa.parse(text,{
      header:false,
      skipEmptyLines:'greedy',
      delimitersToGuess:[',','\t',';','|'],
      quoteChar:'"',
      escapeChar:'"'
    });
    const fatal=(parsed.errors||[]).find(e=>String(e.code||'')==='Quotes');
    if(fatal)throw new Error(fatal.message||'CSV parsing failed. Please check the delimiter and quoted values.');
    const matrix=parsed.data||[];
    if(!matrix.length)throw new Error('No rows were found in the CSV file.');
    rawRows=sourceMatrixToRows(matrix).rows;
  }
  rawRows=rawRows.filter(row=>Object.values(row||{}).some(v=>String(v??'').trim()!==''));
  if(!rawRows.length)throw new Error('No usable data rows were found.');
  if(rawRows.length>50000)throw new Error('Maximum 50,000 rows per import. Split the file into smaller imports.');
  validateImportStructure(module,rawRows,sourceName);
  return {rows:normalizeModuleRows(module,rawRows),sourceName,ext};
}

async function insertRecords(module,rows,clientId,mode){
  if(!state.session?.user?.id)throw new Error('Your session has expired. Please sign in again.');
  if(!clientId)throw new Error('A client is required for import.');
  if(!['admin','user'].includes(getRole()))throw new Error('You do not have permission to import data.');
  if(!schemas[module])throw new Error('Invalid RCM module.');
  if(!['replace','append'].includes(mode))throw new Error('Invalid import mode.');
  if(!Array.isArray(rows)||!rows.length)throw new Error('No records to import.');
  if(rows.length>50000)throw new Error('Maximum 50,000 rows per import.');
  const batchId=crypto.randomUUID?.()||`batch-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const importedAt=new Date().toISOString();
  const payload=rows.map((r,index)=>{
    const sourceIndex=Number.isFinite(Number(r?.__source_row_index))?Number(r.__source_row_index):index;
    const data={...r,__source_row_index:sourceIndex,__imported_at:importedAt,__source_batch_id:batchId};
    return {external_id:`${batchId}:${String(sourceIndex+1).padStart(8,'0')}`,data};
  });
  const {data,error}=await sb.functions.invoke('rcm-import',{body:{client_id:clientId,module,mode,rows:payload,import_batch_id:batchId}});
  if(error)throw new Error(error.message||'Import failed.');
  if(data?.error)throw new Error(data.error);
  clearRecordsCache();
  return data||{import_batch_id:batchId,inserted:rows.length};
}

async function loadData(){
 if(DEMO_MODE){state.records=demoData();state.dataCapped=false;return}
 const target=['ar','denials','verification','auth','charges','payments'].includes(state.section)?state.section:null;
 if(!target)return;
 const selectedClientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
 const scope=selectedClientId?`client:${selectedClientId}`:'all:authorized',cacheKey=`${scope}|${target}`;
 const cached=recordsCache.get(cacheKey);
 if(cached&&Date.now()-cached.savedAt<RECORD_CACHE_TTL_MS){state.records={...(state.records||{}),[target]:(cached.records?.[target]||[])};state.dataCapped=cached.dataCapped;return}
 const seq=++v14LoadSeq,firstSize=500,maxRows=10000;
 let q=sb.from('rcm_records').select('client_id,module,external_id,data,uploaded_at,import_batch_id');
 if(selectedClientId)q=q.eq('client_id',selectedClientId);q=q.eq('module',target);
 const first=await q.order('uploaded_at',{ascending:false}).range(0,firstSize-1);
 if(first.error)throw first.error;
 const firstRecords=v14HydrateRows(first.data||[]);
 Object.keys(firstRecords).forEach(m=>{firstRecords[m]=firstRecords[m].map((r,index)=>({r,index})).sort((x,y)=>compareSourceOrder(x.r,y.r)||x.index-y.index).map(x=>x.r)});
 state.records={...(state.records||{}),[target]:(firstRecords[target]||[])};state.dataCapped=false;
 if((first.data||[]).length<firstSize){recordsCache.set(cacheKey,{records:firstRecords,dataCapped:false,savedAt:Date.now()});return}
 v14LoadingModules.set(cacheKey,true);
 // Remaining pages load without blocking the screen.
 void (async()=>{
   try{
    const source=[...(first.data||[])];
    for(let offset=firstSize;offset<maxRows;offset+=1000){
      let qq=sb.from('rcm_records').select('client_id,module,external_id,data,uploaded_at,import_batch_id');
      if(selectedClientId)qq=qq.eq('client_id',selectedClientId);qq=qq.eq('module',target);

    Object.keys(records).forEach(m=>{records[m]=records[m].map((r,index)=>({r,index})).sort((x,y)=>compareSourceOrder(x.r,y.r)||x.index-y.index).map(x=>x.r)});
    recordsCache.set(cacheKey,{records,dataCapped:source.length>=maxRows,savedAt:Date.now()});
    const currentClientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);

    if(seq===v14LoadSeq&&sameScope){state.records={...(state.records||{}),[target]:(records[target]||[])};state.dataCapped=source.length>=maxRows}

   }catch(e){console.error('Background module load failed',e)}

}

async function login(){
  const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,err=document.getElementById('loginError'),btn=document.querySelector('#loginForm button[type="submit"],#loginForm .login-submit');
  if(err)err.innerHTML='';
  if(!email||!password){if(err)err.innerHTML='<div class="error">Enter your email and password.</div>';return}
  if(navigator.onLine===false){if(err)err.innerHTML='<div class="error">No internet connection. Reconnect and try again.</div>';return}
  const original=btn?.innerHTML||'';
  if(btn){btn.disabled=true;btn.classList.add('busy');btn.innerHTML='<span>Signing in…</span>'}
  try{
    if(DEMO_MODE){
      const u=demoUsers.find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.active),pass={admin:'Admin@123',user:'User@123',client:'Client@123',provider:'Provider@123'}[u?.role];
      if(!u||password!==pass)throw new Error('Invalid demo credentials.');
      state.session={user:{id:u.id,email:u.email}};state.profile=u;await enterApp();return
    }
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    state.session=data.session;
    await loadProfile();
    await enterApp();
  }catch(e){
    const msg=/failed to fetch|networkerror|network request/i.test(String(e?.message||e))?'Unable to reach the secure server. Check your internet connection and try again.':String(e?.message||'Unable to sign in.');
    if(err)err.innerHTML=`<div class="error">${esc(msg)}</div>`;
  }finally{
    const liveBtn=document.querySelector('#loginForm button[type="submit"],#loginForm .login-submit');
    if(liveBtn){liveBtn.disabled=false;liveBtn.classList.remove('busy');if(original)liveBtn.innerHTML=original}
  }
}

async function boot(){

  document.getElementById('app').innerHTML='<div class="v25-auth-restore" style="min-height:100vh;display:grid;place-items:center;background:#f5f8fc;color:#60758a;font:600 13px Inter,Arial,sans-serif"><div>Opening secure workspace…</div></div>';
  window.addEventListener('online',syncNetworkState);window.addEventListener('offline',syncNetworkState);
  // Sidebar buttons call navigateToSection() directly; handlers survive all live updates.

  document.addEventListener('click',e=>{
    const t=e.target.closest?.('#v6Print,#v6ShortcutsBtn,#v6CloseShortcuts');
    if(!t)return;
    if(t.id==='v6Print'){window.print();return}
    const modal=document.getElementById('v6Shortcuts');if(!modal)return;
    if(t.id==='v6ShortcutsBtn')modal.classList.add('show');
    if(t.id==='v6CloseShortcuts')modal.classList.remove('show');
  });
  window.addEventListener('keydown',e=>{
    const modal=document.getElementById('v6Shortcuts');
    if(e.key==='Escape'&&modal?.classList.contains('show')){modal.classList.remove('show');return}
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){const q=document.getElementById('tableSearch');if(q){e.preventDefault();q.focus()}}
  });
  if(DEMO_MODE)return;
  try{
    const {data,error}=await sb.auth.getSession();if(error)throw error;
    if(data.session){state.session=data.session;await loadProfile();await enterApp()}else{document.getElementById('app').innerHTML=loginView();bindLogin();}
  }catch(e){
    console.warn('Session restore failed:',e);
    try{await sb.auth.signOut()}catch(_){}
    document.getElementById('app').innerHTML=loginView();bindLogin();
  }
  sb.auth.onAuthStateChange((event)=>{
    if(event==='SIGNED_OUT'){stopProductionSync();stopCommRealtime();clearRecordsCache();state=freshState();document.getElementById('app').innerHTML=loginView();bindLogin()}
  })
}

function pfSum(rows,keys){return rows.reduce((a,r)=>{for(const k of keys){const n=parseNumericValue(r?.[k]);if(n!==null)return a+n}return a},0)}

function pfBounds(period=state.premiumPeriod){
 const now=new Date(), end=new Date(now.getFullYear(),now.getMonth(),now.getDate()), start=new Date(end);
 if(period==='all')return {start:null,end:null};
 if(period==='30')start.setDate(start.getDate()-29);
 else if(period==='90')start.setDate(start.getDate()-89);
 else if(period==='ytd')start.setFullYear(start.getFullYear(),0,1);
 else if(period==='custom'){
   const a=state.premiumFrom?new Date(state.premiumFrom+'T00:00:00'):null,b=state.premiumTo?new Date(state.premiumTo+'T23:59:59'):null;
   return {start:a,end:b||end};
 }
 return {start,end};
}
function pfRows(m,b=pfBounds()){
 return getRecords(m).filter(r=>{
   if(!b.start&&!b.end)return true;
   const d=pfDate(m,r);if(!d)return false;
   if(b.start&&d<b.start)return false;if(b.end&&d>b.end)return false;return true;
 });
}
function pfPreviousBounds(b){
 if(!b.start||!b.end)return {start:null,end:null};
 const days=Math.max(1,Math.round((b.end-b.start)/86400000)+1),end=new Date(b.start);end.setDate(end.getDate()-1);const start=new Date(end);start.setDate(start.getDate()-days+1);return {start,end};
}
function pfTrend(cur,prev,invert=false){
 if(!Number.isFinite(cur)||!Number.isFinite(prev)||prev===0)return `<span class="pf-neutral">Previous-period comparison unavailable</span>`;
 const d=(cur-prev)/Math.abs(prev)*100, good=invert?d<=0:d>=0, cls=good?'pf-up':'pf-down';
 return `<span class="${cls}">${d>=0?'↑':'↓'} ${Math.abs(d).toFixed(1)}% vs previous period</span>`;
}
function pfBucket(age){
 const n=Number(age);if(!Number.isFinite(n))return 'Unknown';
 if(n<=30)return '0–30';if(n<=60)return '31–60';if(n<=90)return '61–90';if(n<=120)return '91–120';return '120+';

function pfGroup(rows,nameFn,valueFn){

function pfMetricSet(bounds){

 let claims=chg.length;
 if(!bounds.start&&!bounds.end&&state.dashboard?.summary){
   const ds=state.dashboard.summary;
   if(!outAR&&Number(ds.total_ar||0))outAR=Number(ds.total_ar||0);
   if(!payments&&Number(ds.posted_amount||0))payments=Number(ds.posted_amount||0);
   if(!denAmt&&Number(ds.denial_amount||0))denAmt=Number(ds.denial_amount||0);
 }
 const denialCount=den.length||((!bounds.start&&!bounds.end)?Number(state.dashboard?.summary?.denial_count||0):0);
 const denRate=claims?denialCount/claims*100:null,collection=charges?payments/charges*100:null;
