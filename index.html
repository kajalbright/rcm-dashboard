function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function parseNumericValue(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number')return Number.isFinite(v)?v:null;

  let raw=String(v).trim();
  if(!raw||/^(nan|null|undefined|n\/a|na|none|-)$/i.test(raw))return null;

  // Normalize accounting/currency strings:
  // $2,205.00 / USD 2,205.00 / 2,205.00 USD / (2,205.00) / -$2,205.00
  raw=raw.replace(/\u00A0/g,' ').trim();
  const negativeParens=/^\(.*\)$/.test(raw);
  raw=raw.replace(/^\((.*)\)$/,'$1').trim();
  raw=raw.replace(/[−–—]/g,'-');
  raw=raw.replace(/^\s*(USD|US\$)\s*/i,'');
  raw=raw.replace(/\s*(USD|US\$)\s*$/i,'');
  raw=raw.replace(/[$£€₹]/g,'');
  raw=raw.replace(/,/g,'');
  raw=raw.replace(/\s+/g,'');
  raw=raw.replace(/(CR|DR)$/i,'');

  if(!raw||raw==='-'||raw==='+')return null;
  const n=Number(raw);
  if(!Number.isFinite(n))return null;
  return negativeParens?-Math.abs(n):n;
}

function num(v){
 const n=parseNumericValue(v);
 return n===null?0:n;
}
function money(v){
  const n=parseNumericValue(v);
  if(n===null){
    const raw=String(v??'').trim();
    // Never display "$NaN". If the imported source value is not numeric,
    // show the original value so data is not silently destroyed.
    return raw && !/^(nan|null|undefined)$/i.test(raw) ? esc(raw) : '—';
  }
  return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

 if(m){const y=+m[1],mo=+m[2],d=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31)return `${String(y).padStart(4,'0')}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

 if(m){const mo=+m[1],d=+m[2],y=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

   Object.entries(src).forEach(([rawKey,value],columnIndex)=>{

     }

function repairMoneyFields(module,r){

    const current=r[canonical];
    if(parseNumericValue(current)!==null)return;
    for(const key of candidates){
      if(key===canonical)continue;
      const candidate=r[key];
      if(parseNumericValue(candidate)!==null){
        r[canonical]=candidate;

      }
    }
  });

}

}

function commCurrentWorkspace(){
  const allowed=commClients();
  const selectedId=state.client?.id?String(state.client.id):'';
  const remembered=state.commClient?String(state.commClient):'';
  const role=commRole();
  const wanted=(role==='client'||role==='provider')
    ? (selectedId||remembered)
    : (remembered||selectedId||String(commWorkspace()||''));
  const c=allowed.find(x=>String(x.id)===wanted)
    ||allowed.find(x=>String(x.id)===selectedId)
    ||allowed[0]||null;
  state.commClient=c?String(c.id):'';
  return c;
}
function commStatusClass(v){v=String(v||'Open').toLowerCase();return v.includes('resolved')?'comm-resolved':v.includes('progress')?'comm-progress':'comm-open'}
state.commUnread=state.commUnread||{};

function ensureCommState(){if(!state.commUnread||typeof state.commUnread!=='object')state.commUnread={};if(!['messages','requests'].includes(state.commTab))state.commTab='messages'}
function commUnreadFor(w){ensureCommState();return Number(state.commUnread?.[String(w)]||0)}
async function commRefreshUnread(){
  if(['client','provider'].includes(commRole()))return; // v15: no practice-wide reads
  if(DEMO_MODE||!state.session?.user)return;
  const clients=commClients(); if(!clients.length)return;
  try{
    for(const c of clients){
      const w=String(c.id);
      if(state.section==='communication'&&state.commTab==='messages'&&String(commCurrentWorkspace()?.id||'')===w){
        ensureCommState();state.commUnread[w]=0;continue;
      }
      const {data:read,error:readError}=await sb.from('communication_reads').select('last_read_at').eq('client_id',w).eq('user_id',state.session.user.id).maybeSingle();
      if(readError)continue;
      const {count,error}=await sb.from('communication_messages').select('id',{count:'exact',head:true}).eq('client_id',w).neq('sender_id',state.session.user.id).gt('created_at',read?.last_read_at||'1970-01-01T00:00:00Z');
      if(!error){ensureCommState();state.commUnread[w]=count||0;}
    }

function compactMoney(v){const n=Number(v||0),a=Math.abs(n);if(a>=1000000)return '$'+(n/1000000).toFixed(a>=10000000?1:2).replace(/\.0$/,'')+'M';if(a>=1000)return '$'+(n/1000).toFixed(a>=100000?0:1).replace(/\.0$/,'')+'K';return money(n)}

function dashboardSummaryZero(){return {total_ar:0,ar_claims:0,denial_count:0,open_denials:0,posting_rate:null,denial_amount:0,posted_amount:0,total_deposits:0,payment_records:0}}
function mergeDashboardSummaries(items){const o=dashboardSummaryZero();items.forEach(x=>{if(!x)return;['total_ar','ar_claims','denial_count','open_denials','denial_amount','posted_amount','total_deposits','payment_records'].forEach(k=>o[k]+=Number(x[k]||0))});o.posting_rate=o.total_deposits>0?o.posted_amount/o.total_deposits*100:null;return o}
function mergeAging(items){const map=new Map(),order=['0-30','31-60','61-90','91-120','121-180','181-240','241-365','365+'];items.flat().forEach(x=>{const k=String(x?.bucket||'Unclassified'),c=map.get(k)||{bucket:k,claim_count:0,balance:0};c.claim_count+=Number(x?.claim_count||0);c.balance+=Number(x?.balance||0);map.set(k,c)});return [...map.values()].sort((a,b)=>(order.indexOf(a.bucket)<0?999:order.indexOf(a.bucket))-(order.indexOf(b.bucket)<0?999:order.indexOf(b.bucket))||a.bucket.localeCompare(b.bucket))}
async function fetchExecutiveDashboard(){
  if(DEMO_MODE){await loadData();return {summary:dashboardSummaryZero(),aging:[]}}
  if(getRole()==='provider'){
    await loadData();const ar=filteredRows('ar'),den=filteredRows('denials'),pay=filteredRows('payments'),sum=(rows,k)=>rows.reduce((a,r)=>a+(parseNumericValue(r[k])||0),0);
    return {summary:{total_ar:sum(ar,'balance'),ar_claims:ar.length,denial_count:den.length,open_denials:den.filter(r=>/open/i.test(r.status)).length,posting_rate:sum(pay,'total_deposit_amount')?sum(pay,'posted_amount')/sum(pay,'total_deposit_amount')*100:null,denial_amount:sum(den,'balance'),posted_amount:sum(pay,'posted_amount'),total_deposits:sum(pay,'total_deposit_amount'),payment_records:pay.length},aging:[]};
  }
  const ids=state.client?.id?[state.client.id]:state.clients.map(c=>c.id);
  if(!ids.length)return {summary:dashboardSummaryZero(),aging:[]};

  // V55: one secure server-side aggregate replaces separate summary + aging scans.
  // Raw RCM rows are not downloaded for Overview.
  const one=async id=>{
    const ck=`bha_exec_client_v55_${id}`;
    try{
      const c=JSON.parse(sessionStorage.getItem(ck)||'null');
      if(c&&Date.now()-c.savedAt<300000)return c.data;
    }catch(_){}
    const r=await sb.rpc('app_rcm_summary',{p_client_id:id});
    if(r.error)throw r.error;
    const x=r.data||{};
    const summary={
      total_ar:Number(x.total_ar||0),ar_claims:Number(x.ar_claims||0),
      denial_count:Number(x.denial_count||0),open_denials:Number(x.open_denials||0),
      posting_rate:x.posting_rate==null?null:Number(x.posting_rate),
      denial_amount:Number(x.denial_amount||0),posted_amount:Number(x.posted_amount||0),
      total_deposits:Number(x.total_deposits||0),payment_records:Number(x.payment_records||0)
    };

    const data={summary,aging};
    try{sessionStorage.setItem(ck,JSON.stringify({savedAt:Date.now(),data}))}catch(_){}

  };

  const withTimeout=(promise,ms=7000)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Dashboard request timed out')),ms))]);

  return {summary:mergeDashboardSummaries(results.map(x=>x.summary)),aging:mergeAging(results.map(x=>x.aging))}
}

function getSchemaHeaderInfo(module,rawRows){
  const s=schemas[module];
  const keys=rawRows.length?Object.keys(rawRows[0]||{}):[];
  const aliasSet=new Set();
  Object.entries(s.aliases||{}).forEach(([canonical,names])=>[canonical,...names].forEach(n=>aliasSet.add(normalizeHeader(n))));
  const recognized=keys.filter(k=>aliasSet.has(normalizeHeader(k)));
  const normalizedKeys=keys.map(normalizeHeader).filter(Boolean);
  const joined=normalizedKeys.join('');
  const knownHeaders=Object.keys(s.aliases||{}).flatMap(k=>[k,...(s.aliases[k]||[])]).map(normalizeHeader);
  const suspiciousTokens=knownHeaders.filter(h=>h.length>=5 && joined.includes(h));
  const duplicateNormalized=new Set();
  const duplicates=[];
  const canonicalSeen=new Map();
  const aliasCollisions=[];
  for(const k of keys){
    const n=normalizeHeader(k);
    if(!n)continue;
    if(duplicateNormalized.has(n))duplicates.push(k);
    duplicateNormalized.add(n);
    const canonical=aliasSet.has(n)?Object.entries(s.aliases||{}).find(([c,names])=>[c,...names].some(x=>normalizeHeader(x)===n))?.[0]:null;
    if(canonical){
      if(canonicalSeen.has(canonical))aliasCollisions.push({header:k,canonical});
      else canonicalSeen.set(canonical,k);
    }
  }
  return {keys,recognized,duplicates,aliasCollisions,suspiciousTokens};
}
function validateImportStructure(module,rawRows,fileName){
  const s=schemas[module];
  if(!s)throw new Error(`Unsupported module: ${module}`);
  if(!Array.isArray(rawRows)||!rawRows.length)throw new Error('No data rows found. Make sure the first row contains column names.');
  const info=getSchemaHeaderInfo(module,rawRows);
  if(!info.keys.length)throw new Error('No column headers were detected. The first row must contain column names.');
  if(info.duplicates.length)throw new Error(`Duplicate column header detected: ${info.duplicates[0]}. Rename duplicate columns and try again.`);
  // Multiple differently-named source columns may map to one analytics field.
  // The first powers analytics; subsequent columns are preserved exactly in Detailed Records.
  const nonEmptyHeaders=info.keys.filter(k=>String(k??'').trim()!=='');
  if(nonEmptyHeaders.length<2)throw new Error('The file contains too few columns. Please check that the header row is correct.');
  // A common failure mode is a header accidentally concatenated into one field, e.g. payerDate of Servicebalance...
  if(info.keys.length<=2 && info.suspiciousTokens.length>=3){
    throw new Error(`The header row appears malformed or concatenated. Example detected in ${fileName||'the file'}. Please export the sheet again with separate columns.`);
  }
  if(info.recognized.length===0){
    // Source-exact fallback: operational exports often use practice-specific headers.
    // Preserve every source column instead of blocking the upload. Analytics fields
    // populate whenever aliases are recognized; otherwise Detailed Records still remain usable.
    console.warn(`No standard analytics headers recognized for ${modules[module].label}; importing source-exact columns.`);
  }
  // One recognized operational field is enough to safely scope the dataset.
  // All additional source columns are retained even when they are not analytics fields.
}

function sourceMatrixToRows(matrix,module='ar'){
  if(!Array.isArray(matrix)||!matrix.length)throw new Error('No rows were found in the file.');
  const width=Math.max(...matrix.map(r=>Array.isArray(r)?r.length:0),0);
  if(width<2)throw new Error('Only one column was detected.');
  // Operational reports may start with title, date, and blank lines. Find the
  // actual claim header rather than treating the first worksheet row as headers.
  const norm=v=>String(v??'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const candidates=matrix.slice(0,60).map((r,i)=>{
    const h=(Array.isArray(r)?r:[]).map(norm);
    const hits=['claimno','claimnumber','claimdate','servicedate','patientname','balance','charges','current','3160','6190','91120','over120'].filter(x=>h.includes(x)).length;
    const strong=h.some(x=>['claimno','claimnumber','claimdate'].includes(x))&&h.some(x=>['balance','charges','current'].includes(x));
    return {i,hits,strong};
  }).filter(x=>x.strong&&x.hits>=3).sort((a,b)=>b.hits-a.hits||a.i-b.i);
  const headerIndex=candidates.length?candidates[0].i:0;
  const rawHeaders=Array.from({length:width},(_,i)=>String(matrix[headerIndex]?.[i]??'').replace(/^\uFEFF/,'').trim()||`Column ${i+1}`);
  const seen=new Map();
  const headers=rawHeaders.map((h,i)=>{const n=normalizeHeader(h)||`column${i+1}`;const c=(seen.get(n)||0)+1;seen.set(n,c);return c===1?h:`${h} (${c})`});
  const rows=matrix.slice(headerIndex+1).filter(row=>Array.isArray(row)&&row.some(v=>String(v??'').trim()!=='')).map((row,rowIndex)=>{
    const obj={};headers.forEach((h,i)=>{obj[h]=row?.[i]??''});
    Object.defineProperty(obj,'__raw_source_headers',{value:rawHeaders,enumerable:false,configurable:true});
    Object.defineProperty(obj,'__raw_source_row_index',{value:headerIndex+rowIndex+1,enumerable:false,configurable:true});
    return obj;
  });
  return {rows,rawHeaders,width,headerIndex};
}

async function parseImportFile(file,module){
  const ext=getFileExtension(file);
  if(!['csv','xlsx','xls'].includes(ext))throw new Error('Unsupported file. Please upload CSV, XLSX, or XLS.');
  if(file.size===0)throw new Error('The selected file is empty.');
  

  let rawRows=[];
  let sourceName=file.name||'file';
  if(['xlsx','xls'].includes(ext)){
    if(typeof XLSX==='undefined')throw new Error('Excel reader is unavailable. Please refresh the page and try again.');
    const buffer=await file.arrayBuffer();
    const workbook=XLSX.read(buffer,{type:'array',cellDates:false,raw:false});
    if(!workbook.SheetNames?.length)throw new Error('No worksheet was found in the Excel file.');
    const parsedSheets=[];
    for(const name of workbook.SheetNames){
      const matrix=XLSX.utils.sheet_to_json(workbook.Sheets[name],{header:1,defval:'',blankrows:false,raw:false});
      if(!matrix.some(row=>Array.isArray(row)&&row.some(v=>String(v??'').trim()!=='')))continue;
      const parsed=sourceMatrixToRows(matrix,module).rows;
      if(parsed.length)parsedSheets.push({name,rows:parsed});
    }
    if(!parsedSheets.length)throw new Error('No importable rows were found in the Excel worksheets.');
    sourceName=`${file.name} — ${parsedSheets.length} worksheet(s)`;
    rawRows=parsedSheets.flatMap(({name,rows})=>rows.map(row=>({...row,source_worksheet:name})));
  }else{
    if(typeof Papa==='undefined')throw new Error('CSV reader is unavailable. Please refresh the page and try again.');
    const buffer=await file.arrayBuffer();
    const bytes=new Uint8Array(buffer);
    let encoding='utf-8';
    if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE)encoding='utf-16le';
    else if(bytes.length>=2&&bytes[0]===0xFE&&bytes[1]===0xFF)encoding='utf-16be';
    let text;
    try{text=new TextDecoder(encoding).decode(buffer)}catch(_){text=new TextDecoder('utf-8').decode(buffer)}
    text=String(text||'').replace(/^\uFEFF/,'');
    if(!text.trim())throw new Error('The selected CSV file is empty.');
    const parsed=Papa.parse(text,{
      header:false,
      skipEmptyLines:'greedy',
      delimitersToGuess:[',','\t',';','|'],
      quoteChar:'"',
      escapeChar:'"'
    });
    const fatal=(parsed.errors||[]).find(e=>String(e.code||'')==='Quotes');
    if(fatal)throw new Error(fatal.message||'CSV parsing failed. Please check the delimiter and quoted values.');
    const matrix=parsed.data||[];
    if(!matrix.length)throw new Error('No rows were found in the CSV file.');
    rawRows=sourceMatrixToRows(matrix,module).rows;
  }
  rawRows=rawRows.filter(row=>Object.values(row||{}).some(v=>String(v??'').trim()!==''));
  if(!rawRows.length)throw new Error('No usable data rows were found.');
  validateImportStructure(module,rawRows,sourceName);
  return {rows:normalizeModuleRows(module,rawRows),sourceName,ext};
}

async function insertRecords(module,rows,clientId,mode){
  if(!state.session?.user?.id)throw new Error('Your session has expired. Please sign in again.');
  if(!clientId)throw new Error('A client is required for import.');
  if(!['admin','user'].includes(getRole()))throw new Error('You do not have permission to import data.');
  if(!schemas[module])throw new Error('Invalid RCM module.');
  if(!['replace','append'].includes(mode))throw new Error('Invalid import mode.');
  if(!Array.isArray(rows)||!rows.length)throw new Error('No records to import.');
  const batchId=crypto.randomUUID?.()||`batch-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const importedAt=new Date().toISOString();
  const payload=rows.map((r,index)=>{
    const sourceIndex=Number.isFinite(Number(r?.__source_row_index))?Number(r.__source_row_index):index;
    const data={...r,__source_row_index:sourceIndex,__imported_at:importedAt,__source_batch_id:batchId};
    return {external_id:`${batchId}:${String(index+1).padStart(8,'0')}`,data};
  });
  const requestSize=1000;
  let inserted=0;
  const result=document.getElementById('importResult');
  for(let from=0;from<payload.length;from+=requestSize){
    const chunk=payload.slice(from,from+requestSize);
    const finalize=from+chunk.length>=payload.length;
    if(result)result.innerHTML=`<div class="notice">Uploading ${Math.min(from+chunk.length,payload.length).toLocaleString()} of ${payload.length.toLocaleString()} records…</div>`;
    const {data,error}=await sb.functions.invoke('rcm-import',{body:{client_id:clientId,module,mode,rows:chunk,import_batch_id:batchId,finalize}});
    if(error)throw new Error(error.message||`Import failed after ${inserted.toLocaleString()} rows.`);
    if(data?.error)throw new Error(data.error);
    inserted+=Number(data?.inserted??chunk.length);
  }
  if(inserted!==rows.length)throw new Error(`Import incomplete: server accepted ${inserted.toLocaleString()} of ${rows.length.toLocaleString()} rows.`);
  clearRecordsCache();
  return {import_batch_id:batchId,inserted};
}

async function loadData(){
 if(DEMO_MODE){state.records=demoData();state.dataCapped=false;return}
 const target=['ar','denials','verification','auth','charges','payments'].includes(state.section)?state.section:null;
 if(!target)return;
 const selectedClientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
 if(selectedClientId&&!isAuthorizedClientId(selectedClientId))throw new Error('This practice is not assigned to your account.');
 const scope=selectedClientId?`client:${selectedClientId}`:'all:authorized',cacheKey=`${scope}|${target}`;
 const cached=recordsCache.get(cacheKey);
 if(cached&&Date.now()-cached.savedAt<RECORD_CACHE_TTL_MS){state.records={...(state.records||{}),[target]:(cached.records?.[target]||[])};state.dataCapped=cached.dataCapped;return}
 const seq=++v14LoadSeq,pageSize=1000;
 v14LoadingModules.set(cacheKey,true);
 try{
   const makeQuery=()=>{
     let q=sb.from('rcm_records').select('client_id,module,external_id,data,uploaded_at,import_batch_id',{count:'exact'});
     if(selectedClientId)q=q.eq('client_id',selectedClientId);
     return q.eq('module',target).order('uploaded_at',{ascending:false});
   };
   const first=await makeQuery().range(0,pageSize-1);
   if(first.error)throw first.error;
   const total=Number(first.count??(first.data||[]).length);
   const source=[...(first.data||[])];
   if(total>pageSize){
     const ranges=[];
     for(let offset=pageSize;offset<total;offset+=pageSize)ranges.push([offset,Math.min(offset+pageSize-1,total-1)]);
     // Fetch remaining pages in small parallel waves: substantially faster than serial
     // pagination while avoiding an unbounded burst against Supabase on very large imports.
     const concurrency=16;
     for(let i=0;i<ranges.length;i+=concurrency){
       const wave=ranges.slice(i,i+concurrency);
       const pages=await Promise.all(wave.map(async([from,to])=>{
         const page=await makeQuery().range(from,to);
         if(page.error)throw page.error;
         return page.data||[];
       }));
       pages.forEach(rows=>source.push(...rows));
     }
   }
   const records=v14HydrateRows(source);
   Object.keys(records).forEach(m=>{records[m]=records[m].map((r,index)=>({r,index})).sort((x,y)=>compareSourceOrder(x.r,y.r)||x.index-y.index).map(x=>x.r)});
   recordsCache.set(cacheKey,{records,dataCapped:false,savedAt:Date.now()});
   const currentClientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
   const sameScope=String(currentClientId||'')===String(selectedClientId||'');
   if(seq===v14LoadSeq&&sameScope){state.records={...(state.records||{}),[target]:(records[target]||[])};state.dataCapped=false}

   v14LoadingModules.delete(cacheKey);
 }

async function login(){
  const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,err=document.getElementById('loginError'),btn=document.querySelector('#loginForm button[type="submit"],#loginForm .login-submit');
  if(err)err.innerHTML='';

  if(navigator.onLine===false){if(err)err.innerHTML='<div class="error">No internet connection. Reconnect and try again.</div>';return}
  const original=btn?.innerHTML||'';
  if(btn){btn.disabled=true;btn.classList.add('busy');btn.innerHTML='<span>Signing in…</span>'}
  try{
    if(DEMO_MODE){
      const u=demoUsers.find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.active),pass={admin:'Admin@123',user:'User@123',client:'Client@123',provider:'Provider@123'}[u?.role];
      if(!u||password!==pass)throw new Error('Invalid demo credentials.');
      state.session={user:{id:u.id,email:u.email}};state.profile=u;await enterApp();return
    }
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    // A successful login must never inherit a preceding account's cached PHI.
    clearRecordsCache();
    resetLockedClientState();
    lockedClientId=null;
    state.records={};
    state.session=data.session;
    await loadProfile();
    await enterApp();
  }catch(e){
    const msg=/failed to fetch|networkerror|network request/i.test(String(e?.message||e))?'Unable to reach the secure server. Check your internet connection and try again.':String(e?.message||'Unable to sign in.');
    if(err)err.innerHTML=`<div class="error">${esc(msg)}</div>`;
  }finally{
    const liveBtn=document.querySelector('#loginForm button[type="submit"],#loginForm .login-submit');
    if(liveBtn){liveBtn.disabled=false;liveBtn.classList.remove('busy');if(original)liveBtn.innerHTML=original}
  }
}

state.premiumPeriod=state.premiumPeriod||'all';
state.premiumFrom=state.premiumFrom||'';
state.premiumTo=state.premiumTo||'';

function pfN(v){const n=parseNumericValue(v);return n===null?0:n}
function pfSum(rows,keys){return rows.reduce((a,r)=>{for(const k of keys){const n=parseNumericValue(r?.[k]);if(n!==null)return a+n}return a},0)}
function pfDate(m,r){const s=recordDate(m,r);return s?new Date(s+'T00:00:00'):null}
function pfBounds(period=state.premiumPeriod){
 const now=new Date(), end=new Date(now.getFullYear(),now.getMonth(),now.getDate()), start=new Date(end);
 if(period==='all')return {start:null,end:null};
 if(period==='30')start.setDate(start.getDate()-29);
 else if(period==='90')start.setDate(start.getDate()-89);
 else if(period==='ytd')start.setFullYear(start.getFullYear(),0,1);
 else if(period==='custom'){
   const a=state.premiumFrom?new Date(state.premiumFrom+'T00:00:00'):null,b=state.premiumTo?new Date(state.premiumTo+'T23:59:59'):null;
   return {start:a,end:b||end};
 }
 return {start,end};
}
function pfRows(m,b=pfBounds()){
 return getRecords(m).filter(r=>{
   if(!b.start&&!b.end)return true;
   const d=pfDate(m,r);if(!d)return false;
   if(b.start&&d<b.start)return false;if(b.end&&d>b.end)return false;return true;
 });
}
function pfPreviousBounds(b){
 if(!b.start||!b.end)return {start:null,end:null};
 const days=Math.max(1,Math.round((b.end-b.start)/86400000)+1),end=new Date(b.start);end.setDate(end.getDate()-1);const start=new Date(end);start.setDate(start.getDate()-days+1);return {start,end};
}
function pfTrend(cur,prev,invert=false){
 if(!Number.isFinite(cur)||!Number.isFinite(prev)||prev===0)return `<span class="pf-neutral">Previous-period comparison unavailable</span>`;
 const d=(cur-prev)/Math.abs(prev)*100, good=invert?d<=0:d>=0, cls=good?'pf-up':'pf-down';
 return `<span class="${cls}">${d>=0?'↑':'↓'} ${Math.abs(d).toFixed(1)}% vs previous period</span>`;
}
function pfBucket(age){
 const n=Number(age);if(!Number.isFinite(n))return 'Unknown';
 if(n<=30)return '0–30';if(n<=60)return '31–60';if(n<=90)return '61–90';if(n<=120)return '91–120';return '120+';
}
function pfGroup(rows,nameFn,valueFn){
 const map=new Map();rows.forEach(r=>{const k=String(nameFn(r)||'Unspecified').trim()||'Unspecified';map.set(k,(map.get(k)||0)+Number(valueFn(r)||0));});return [...map.entries()].sort((a,b)=>b[1]-a[1]);
}

 return `<div class="pf-card"><h3>${esc(title)}</h3><div class="cap">${esc(cap)}</div><div class="pf-bars">${items.slice(0,8).map(([n,v])=>`<div class="pf-bar"><div class="pf-bar-name" title="${esc(n)}">${esc(n)}</div><div class="pf-track"><div class="pf-fill" style="width:${max?Math.max(2,v/max*100):0}%"></div></div><div class="pf-bar-val">${formatter(v)}</div></div>`).join('')||'<div class="muted">No supported data in this period.</div>'}</div></div>`;
}

function pfMetricSet(bounds){
 const ar=pfRows('ar',bounds),den=pfRows('denials',bounds),chg=pfRows('charges',bounds),pay=pfRows('payments',bounds);
 let charges=pfSum(chg,['charge','charges']),payments=pfSum(pay,['posted_amount','payment_amount']),outAR=pfSum(ar,['balance']),denAmt=pfSum(den,['balance','charge']);
 let claims=chg.length;
 if(!bounds.start&&!bounds.end&&state.dashboard?.summary){
   const ds=state.dashboard.summary;
   if(!outAR&&Number(ds.total_ar||0))outAR=Number(ds.total_ar||0);
   if(!payments&&Number(ds.posted_amount||0))payments=Number(ds.posted_amount||0);
   if(!denAmt&&Number(ds.denial_amount||0))denAmt=Number(ds.denial_amount||0);
 }
 const denialCount=den.length||((!bounds.start&&!bounds.end)?Number(state.dashboard?.summary?.denial_count||0):0);
 const denRate=claims?denialCount/claims*100:null,collection=charges?payments/charges*100:null;
 const avgDaily=charges&&bounds.start&&bounds.end?charges/Math.max(1,Math.round((bounds.end-bounds.start)/86400000)+1):0;
 const daysAR=avgDaily?outAR/avgDaily:null;
 const clean=claims?Math.max(0,(claims-den.length)/claims*100):null;
 return {ar,den,chg,pay,charges,payments,outAR,denAmt,claims,denialCount,denRate,collection,daysAR,clean};
}
function pfKpi(label,value,sub){return `<div class="pf-kpi"><label>${label}</label><strong>${value}</strong><small>${sub}</small></div>`}
function pfMonthKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function pfBuildTrend(m){
 const map=new Map();[['charges',m.chg,'charge'],['payments',m.pay,'posted_amount'],['ar',m.ar,'balance']].forEach(([type,rows,key])=>rows.forEach(r=>{const d=pfDate(type==='charges'?'charges':type==='payments'?'payments':'ar',r);if(!d)return;const k=pfMonthKey(d),x=map.get(k)||{charges:0,payments:0,ar:0};x[type]+=pfN(r[key]);map.set(k,x)}));
 const keys=[...map.keys()].sort();return {keys,charges:keys.map(k=>map.get(k).charges),payments:keys.map(k=>map.get(k).payments),ar:keys.map(k=>map.get(k).ar)};
}

function pfRenderExecutive(){
 const host=document.getElementById('pfExecutive');if(!host)return;
 const b=pfBounds(),prevB=pfPreviousBounds(b),m=pfMetricSet(b),p=pfMetricSet(prevB);
 const old=m.ar.filter(r=>{const a=rowAge(r);return Number.isFinite(a)&&a>90}),oldBal=pfSum(old,['balance']);
 const pendingAuth=m?pfRows('auth',b).filter(r=>/pending|expir|requested|open/i.test(String(r.status||r.auth_status||''))).length:0;

/* V40 — BHA Revenue Intelligence
   Client-scoped, explainable projections. No bank/contract claims are inferred without source datasets. */
function riPick(row,names){
  if(!row)return null;const keys=Object.keys(row),norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  for(const name of names){const want=norm(name),k=keys.find(x=>norm(x)===want);if(k&&row[k]!==''&&row[k]!=null)return row[k]}
  return null;
}
function riDate(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d}
function riPayer(r){return String(riPick(r,['Payer','Insurance','Insurance Name','Primary Insurance','Carrier'])||'Unspecified').trim()||'Unspecified'}
function riBalance(r){return Math.max(0,num(riPick(r,['Balance','AR Balance','Outstanding Balance','Amount Due','Insurance Balance'])))}
function riPayment(r){return Math.max(0,num(riPick(r,['Posted Amount','Payer Payment','Payment Amount','Paid Amount','Insurance Payment','Total Deposit Amount','Amount'])))}
function riAge(r){const direct=parseNumericValue(riPick(r,['Age','Days','Days in AR','AR Days']));if(direct!=null)return Math.max(0,direct);const d=riDate(riPick(r,['Claim Date','Submitted Date','Claim First Submitted Date','DOS','Date of Service']));return d?Math.max(0,Math.floor((Date.now()-d.getTime())/86400000)):null}
function riWeight(age){if(age==null)return .48;if(age<=30)return .82;if(age<=60)return .70;if(age<=90)return .58;if(age<=120)return .46;if(age<=180)return .33;if(age<=240)return .24;if(age<=365)return .16;return .08}
function riConfidence(arCount,payCount){const score=Math.min(100,Math.round(Math.min(arCount/10,55)+Math.min(payCount/4,35)+(arCount>=100&&payCount>=30?10:0)));return {score,label:score>=80?'High':score>=55?'Medium':'Limited'} }

}
async function riFetch(){
 if(DEMO_MODE)return {ar:state.records?.ar||[],payments:state.records?.payments||[]};
 const clientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
 // Fetch each dataset independently. Rebuilding the Supabase query on every page avoids
 // range/filter accumulation and keeps the All Clients admin view responsive.
 async function fetchModule(module){
   const rows=[];
   for(let from=0;;from+=1000){
     let q=sb.from('rcm_records').select('client_id,module,data,uploaded_at').eq('module',module);
     if(clientId)q=q.eq('client_id',clientId);
     const {data,error}=await q.order('uploaded_at',{ascending:false}).range(from,from+999);
     if(error)throw error;
     rows.push(...(data||[]));
     if((data||[]).length<1000)break;
     await new Promise(r=>setTimeout(r,0));
   }
   return rows.map(x=>({...sanitizeStoredRecord(module,x.data),client_id:x.client_id}));
 }
 // All Clients: query each authorized workspace explicitly instead of running one broad
 // cross-client scan. This keeps RLS/index usage efficient and prevents the portfolio view
 // from hanging while preserving strict client scoping.
 if(!clientId && hasAllClients() && Array.isArray(state.clients) && state.clients.length){
   const ids=[...new Set(state.clients.map(c=>c?.id).filter(Boolean))];
   const fetchForClient=async (module,id)=>{
     const rows=[];
     for(let from=0;;from+=1000){
       let q=sb.from('rcm_records').select('client_id,module,data,uploaded_at').eq('module',module).eq('client_id',id);
       const {data,error}=await q.order('uploaded_at',{ascending:false}).range(from,from+999);
       if(error)throw error;
       rows.push(...(data||[]));
       if((data||[]).length<1000)break;
       await new Promise(r=>setTimeout(r,0));
     }
     return rows.map(x=>({...sanitizeStoredRecord(module,x.data),client_id:x.client_id}));
   };
   // Portfolio mode deliberately processes one workspace at a time. V41 launched every
   // client/module request concurrently; large AR workspaces could exhaust the browser's
   // HTTP connection pool and leave the screen waiting indefinitely. Modules within the
   // current workspace still load in parallel, so this remains fast without request storms.
   const allAr=[],allPayments=[];
   for(let i=0;i<ids.length;i++){
     const id=ids[i];
     const liveRoot=document.getElementById('riRoot');
     if(liveRoot&&state.section==='intelligence'){
       const client=state.clients.find(c=>String(c.id)===String(id));
       liveRoot.innerHTML=`<div class="ri-loading"><span></span><div><strong>Preparing Revenue Intelligence</strong><small>Loading ${esc(client?.name||'authorized workspace')} · ${i+1} of ${ids.length}</small></div></div>`;
     }
     const [ar,payments]=await Promise.all([fetchForClient('ar',id),fetchForClient('payments',id)]);
     allAr.push(...ar);allPayments.push(...payments);
     await new Promise(r=>setTimeout(r,20));
   }
   return {ar:allAr,payments:allPayments};
 }
 const [ar,payments,denials]=await Promise.all([fetchModule('ar'),fetchModule('payments'),fetchModule('denials')]);
 return {ar,payments,denials};
}
function riCompute(ds){
 const ar=ds.ar||[],payments=ds.payments||[],denials=ds.denials||[],payer={};let totalAR=0,weighted=0;
 ar.forEach(r=>{const b=riBalance(r);if(!b)return;const p=riPayer(r),a=riAge(r);totalAR+=b;weighted+=b*riWeight(a);payer[p]??={payer:p,ar:0,claims:0,payments:0,paymentRecords:0,weighted:0,denials:0};payer[p].ar+=b;payer[p].claims++;payer[p].weighted+=b*riWeight(a)});
 let totalPaid=0;payments.forEach(r=>{const amt=riPayment(r),p=riPayer(r);totalPaid+=amt;payer[p]??={payer:p,ar:0,claims:0,payments:0,paymentRecords:0,weighted:0,denials:0};payer[p].payments+=amt;payer[p].paymentRecords++});
 denials.forEach(r=>{const p=riPayer(r);payer[p]??={payer:p,ar:0,claims:0,payments:0,paymentRecords:0,weighted:0,denials:0};payer[p].denials++});
 const payers=Object.values(payer).sort((a,b)=>b.ar-a.ar);
 const base=Math.min(totalAR,weighted),p30=base*.46,p60=base*.76,p90=base;
 const conf=riConfidence(ar.length,payments.length),spread=conf.score>=80?.08:conf.score>=55?.15:.25;
 const range=(v)=>({low:Math.max(0,v*(1-spread)),high:v*(1+spread)});
 const old90=riOlderThan90(ar),denialExposure=denials.reduce((a,r)=>a+riBalance(r),0);
 const weekly=[p30*.22,p30*.25,p30*.27,p30*.26];

<script id="v46-brigette-production-engines">

   Adds reusable bank-deposit and contract-rate datasets, conservative reconciliation,

   All calculations remain client scoped. */
modules.bank_deposits={label:'Bank Deposits',icon:'▤'};
modules.contract_rates={label:'Payer Contract Rates',icon:'≋'};
schemas.bank_deposits={
 headers:['deposit_date','payer','eft_trace','check_no','deposit_amount','bank_reference','status'],
 csvHeaders:['Deposit Date','Payer','EFT / Trace No.','Check No.','Deposit Amount','Bank Reference','Status'],
 aliases:{deposit_date:['deposit date','bank date','date','posted date'],payer:['payer','insurance','payor','carrier'],eft_trace:['eft / trace no.','eft trace','eft','trace','trace number','trace no'],check_no:['check no.','check no','check number','check #'],deposit_amount:['deposit amount','bank deposit','amount','deposit','amount deposited'],bank_reference:['bank reference','reference','bank ref','transaction id','transaction reference'],status:['status','bank status','cleared status']},
 map:['deposit_date','payer','eft_trace','check_no','deposit_amount','bank_reference','status']
};
schemas.contract_rates={
 headers:['payer','plan','cpt','modifier','effective_from','effective_to','contracted_allowed','methodology','notes'],
 csvHeaders:['Payer','Plan','CPT','Modifier','Effective From','Effective To','Contracted Allowed Amount','Methodology','Notes'],
 aliases:{payer:['payer','insurance','payor','carrier'],plan:['plan','plan name','product'],cpt:['cpt','cpt code','procedure code','procedure'],modifier:['modifier','mod'],effective_from:['effective from','effective date','start date','effective start'],effective_to:['effective to','end date','termination date','effective end'],contracted_allowed:['contracted allowed amount','contract rate','allowed amount','fee schedule amount','rate'],methodology:['methodology','contract method','rate methodology'],notes:['notes','note','comments']},
 map:['payer','plan','cpt','modifier','effective_from','effective_to','contracted_allowed','methodology','notes']
};
function riNorm(v){return String(v??'').trim().toLowerCase().replace(/[^a-z0-9]/g,'')}
function riClaim(r){return String(riPick(r,['Claim ID','Claim Number','Claim #','claim_id'])||'').trim()}
function riCpt(r){return String(riPick(r,['CPT','CPT Code','Procedure Code','Procedure'])||'').trim()}
function riModifier(r){return String(riPick(r,['Modifier','Mod'])||'').trim()}
function riPlan(r){return String(riPick(r,['Plan','Plan Name','Product'])||'').trim()}
function riPayDate(r){return riDate(riPick(r,['Posted Date','Payment Date','Deposit Date','Date','ERA Date']))}
function riTrace(r){return String(riPick(r,['EFT / Trace No.','EFT Trace','Trace','Trace Number','Trace No','EFT'])||'').trim()}
function riCheck(r){return String(riPick(r,['Check No.','Check No','Check Number','Check #','Check'])||'').trim()}
function riDepositAmount(r){return Math.max(0,num(riPick(r,['Deposit Amount','Bank Deposit','Amount','Amount Deposited']))) }
function riDateDiff(a,b){if(!a||!b)return 999;return Math.abs(Math.round((a.getTime()-b.getTime())/86400000))}
function riContractRate(r){return Math.max(0,num(riPick(r,['Contracted Allowed Amount','Contract Rate','Allowed Amount','Fee Schedule Amount','Rate']))) }
function riEffective(r,date){const f=riDate(riPick(r,['Effective From','Effective Date','Start Date'])),t=riDate(riPick(r,['Effective To','End Date','Termination Date']));return (!f||date>=f)&&(!t||date<=t)}

async function riFetchV46Module(module,clientId){
 const rows=[];
 for(let from=0;;from+=1000){
  let q=sb.from('rcm_records').select('client_id,module,data,uploaded_at').eq('module',module);
  if(clientId)q=q.eq('client_id',clientId);
  const {data,error}=await q.order('uploaded_at',{ascending:false}).range(from,from+999);
  if(error)throw error; rows.push(...(data||[])); if((data||[]).length<1000)break;
 }
 return rows.map(x=>({...sanitizeStoredRecord(module,x.data),client_id:x.client_id}));
}
const __v45RiFetch=riFetch;
riFetch=async function(){
 if(DEMO_MODE){const base=await __v45RiFetch();return {...base,bank_deposits:state.records?.bank_deposits||[],contract_rates:state.records?.contract_rates||[],charges:state.records?.charges||[]}}
 const clientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
 if(!clientId)return __v45RiFetch();
 const [base,bank,contracts,charges]=await Promise.all([__v45RiFetch(),riFetchV46Module('bank_deposits',clientId),riFetchV46Module('contract_rates',clientId),riFetchV46Module('charges',clientId)]);
 return {...base,bank_deposits:bank,contract_rates:contracts,charges};
};

function riReconcile(payments,deposits){
 const used=new Set(),matches=[],exceptions=[];
 const ds=(deposits||[]).map((d,i)=>({d,i,amount:riDepositAmount(d),date:riDate(riPick(d,['Deposit Date','Bank Date','Date','Posted Date'])),payer:riNorm(riPayer(d)),trace:riNorm(riTrace(d)),check:riNorm(riCheck(d))}));
 for(const p of payments||[]){
  const amount=riPayment(p); if(!amount)continue;
  const pd=riPayDate(p),payer=riNorm(riPayer(p)),trace=riNorm(riTrace(p)),check=riNorm(riCheck(p));
  let candidates=ds.filter(x=>!used.has(x.i));
  let best=null,score=-1,why=[];
  for(const x of candidates){let s=0,w=[];
   if(trace&&x.trace&&trace===x.trace){s+=100;w.push('trace')}
   if(check&&x.check&&check===x.check){s+=90;w.push('check')}
   const delta=Math.abs(amount-x.amount); if(delta<.01){s+=35;w.push('amount')} else if(delta<=Math.max(1,amount*.01)){s+=12;w.push('near amount')}
   const dd=riDateDiff(pd,x.date); if(dd<=1){s+=20;w.push('date')} else if(dd<=3){s+=10;w.push('date window')}
   if(payer&&x.payer&&payer===x.payer){s+=12;w.push('payer')}
   if(s>score){score=s;best=x;why=w}
  }
  if(best&&score>=55){used.add(best.i);const variance=best.amount-amount;matches.push({payment:p,deposit:best.d,posted:amount,bank:best.amount,variance,score,why,status:Math.abs(variance)<.01?'Matched':'Partial Match'})}
  else exceptions.push({type:'EHR Posted / Bank Missing',payment:p,amount,payer:riPayer(p),date:pd});
 }
 ds.filter(x=>!used.has(x.i)&&x.amount).forEach(x=>exceptions.push({type:'Bank Deposit / EHR Missing',deposit:x.d,amount:x.amount,payer:riPayer(x.d),date:x.date}));
 return {matches,exceptions,matchedAmount:matches.reduce((a,m)=>a+Math.min(m.posted,m.bank),0),posted:(payments||[]).reduce((a,p)=>a+riPayment(p),0),bank:ds.reduce((a,x)=>a+x.amount,0),variance:ds.reduce((a,x)=>a+x.amount,0)-(payments||[]).reduce((a,p)=>a+riPayment(p),0)};
}
function riContractVariance(ds){
 const contracts=ds.contract_rates||[], payments=ds.payments||[], charges=ds.charges||[];
 const chargeByClaim=new Map(); for(const c of charges){const id=riClaim(c);if(id)chargeByClaim.set(riNorm(id),c)}
 const rows=[];
 for(const p of payments){
  const claim=riClaim(p),charge=claim?chargeByClaim.get(riNorm(claim)):null;
  const cpt=riCpt(p)||riCpt(charge),payer=riPayer(p),mod=riModifier(p)||riModifier(charge),plan=riPlan(p)||riPlan(charge),date=riPayDate(p)||riDate(riPick(charge,['DOS','Date of Service']));
  if(!cpt||!payer)continue;
  const candidates=contracts.filter(c=>riNorm(riPayer(c))===riNorm(payer)&&riNorm(riCpt(c))===riNorm(cpt)&&(!riModifier(c)||riNorm(riModifier(c))===riNorm(mod))&&(!riPlan(c)||!plan||riNorm(riPlan(c))===riNorm(plan))&&riEffective(c,date||new Date()));
  if(!candidates.length)continue;
  const contract=candidates[0],expected=riContractRate(contract),actual=riPayment(p); if(!expected||!actual)continue;
  const variance=actual-expected;
  rows.push({claim,cpt,payer,modifier:mod,expected,actual,variance,status:variance<-.01?'Potential Underpayment':variance>.01?'Over Contract':'Within Contract',payment:p,contract});
 }
 return rows.sort((a,b)=>a.variance-b.variance);
}
function riDownloadPayerExcel(x,payerName){

 const rows=x.payers.filter(p=>!payerName||payerName==='__all__'||p.payer===payerName).map(p=>({Payer:p.payer,Claims:p.claims,'Outstanding AR':p.ar,Payments:p.payments,'Payment Records':p.paymentRecords,Denials:p.denials,'Collectability %':p.ar?Math.round(p.weighted/p.ar*100):0}));
 const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Payer Intelligence');XLSX.writeFile(wb,`BHA_Payer_Intelligence_${(payerName&&payerName!=='__all__'?payerName:'All_Payers').replace(/[^a-z0-9]+/gi,'_')}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function riPrintPayerReport(x,payerName,client){

 w.document.write(`<html><head><title>BHA Payer Intelligence</title><style>body{font-family:Arial;padding:32px;color:#173a58}h1{margin:0}p{color:#60758d}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#f3f7fb;font-size:12px}small{color:#789}</style></head><body><h1>Bright Health Alliance</h1><h2>Payer Intelligence Report</h2><p>${esc(client)} · ${payerName&&payerName!=='__all__'?esc(payerName):'All Payers'} · ${new Date().toLocaleDateString()}</p><table><thead><tr><th>Payer</th><th>Claims</th><th>Outstanding AR</th><th>Payments</th><th>Denials</th><th>Collectability</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.payer)}</td><td>${p.claims}</td><td>${riMoney(p.ar)}</td><td>${riMoney(p.payments)}</td><td>${p.denials}</td><td>${p.ar?Math.round(p.weighted/p.ar*100)+'%':'—'}</td></tr>`).join('')}</tbody></table><p><small>Use the browser Print command and choose “Save as PDF” for a PDF copy.</small></p>

<script>
/* V47 — Brigette completion/export reliability pass.
   Uses Blob-based XLSX downloads and in-page printable reports to avoid popup/writeFile failures. */
function riSafeName(v){return String(v||'report').replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,80)||'report'}
function riDownloadBlob(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function riWorkbookDownload(sheets,fileName){
 try{
  if(typeof XLSX==='undefined')throw new Error('Excel library did not load. Refresh once and try again.');
  const wb=XLSX.utils.book_new();
  Object.entries(sheets).forEach(([name,rows])=>{const data=(rows&&rows.length)?rows:[{Message:'No records available for the current selection'}];const ws=XLSX.utils.json_to_sheet(data);XLSX.utils.book_append_sheet(wb,ws,String(name).slice(0,31));});
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  riDownloadBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fileName);
  toast('Excel report downloaded.');
 }catch(e){console.error('V47 Excel export',e);toast(e.message||'Unable to create Excel report.');}
}
function riDownloadPayerExcel(x,payerName){
 const rows=x.payers.filter(p=>!payerName||payerName==='__all__'||p.payer===payerName).map(p=>({Payer:p.payer,Claims:p.claims,'Outstanding AR':p.ar,Payments:p.payments,'Payment Records':p.paymentRecords,Denials:p.denials,'Collectability %':p.ar?Math.round(p.weighted/p.ar*100):0}));
 riWorkbookDownload({'Payer Intelligence':rows},`BHA_Payer_Intelligence_${riSafeName(payerName&&payerName!=='__all__'?payerName:'All_Payers')}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

<script>
/* V48 — High-speed optimization pass.
   Goals: eliminate duplicate Revenue Intelligence network scans, deduplicate in-flight
   requests, preserve client isolation, and make repeat client switching near-instant. */
const BHA_V48_RI_CACHE_TTL = 5 * 60 * 1000;
const bhaV48RiCache = new Map();
const bhaV48RiInflight = new Map();
function bhaV48RiKey(){
  const id=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
  return id?`client:${String(id)}`:'portfolio';
}
function bhaV48CloneDataset(ds){
  // Arrays are treated as immutable by Revenue Intelligence calculations/rendering.
  return ds||{ar:[],payments:[],denials:[],bank_deposits:[],contract_rates:[],charges:[]};
}
const bhaV48RiFetchNetwork = riFetch;
riFetch = async function(options={}){
  const key=bhaV48RiKey(),now=Date.now(),force=!!options.force;
  if(!force){
    const hit=bhaV48RiCache.get(key);
    if(hit && now-hit.savedAt < BHA_V48_RI_CACHE_TTL) return bhaV48CloneDataset(hit.data);
    if(bhaV48RiInflight.has(key)) return bhaV48RiInflight.get(key);
  }
  const request=(async()=>{
    const data=await bhaV48RiFetchNetwork();
    bhaV48RiCache.set(key,{savedAt:Date.now(),data});
    return bhaV48CloneDataset(data);
  })();
  bhaV48RiInflight.set(key,request);
  try{return await request}finally{if(bhaV48RiInflight.get(key)===request)bhaV48RiInflight.delete(key)}
};
function bhaV48InvalidateRevenue(clientId){
  if(clientId==null){bhaV48RiCache.clear();return}
  bhaV48RiCache.delete(`client:${String(clientId)}`);
}
// Any successful data import can change forecasts/reconciliation/contracts. Clear only
// after the existing import routine succeeds; existing database/import behavior is untouched.
if(typeof insertRecords==='function'){
  const bhaV48InsertRecords=insertRecords;
  insertRecords=async function(module,rows,clientId,mode){
    const out=await bhaV48InsertRecords(module,rows,clientId,mode);
    bhaV48InvalidateRevenue(clientId);
    return out;
  };
}
// Portfolio remains instant. Detailed client datasets are loaded only on demand.
// The per-client cache above makes repeat switching fast without background cross-workspace fetches.
// Small UX polish: cached workspace switches should not flash a long loading state.
const bhaV48RevenueIntelligenceHtml=revenueIntelligenceHtml;
revenueIntelligenceHtml=function(){
  const key=bhaV48RiKey(),hit=bhaV48RiCache.get(key);
  if(hit && Date.now()-hit.savedAt<BHA_V48_RI_CACHE_TTL){
    return pageHead('Revenue Intelligence','Forward-looking cash visibility, payer performance and financial control.')+`<div id="riRoot" class="ri-root"><div class="ri-loading ri-loading-fast"><span></span><div><strong>Opening Revenue Intelligence</strong><small>Opening the latest practice intelligence…</small></div></div></div>`;
  }
  return bhaV48RevenueIntelligenceHtml();
};
</script>

<script>
/* V49 — production performance + presentation pass.
   Client detail loads use bounded parallel pagination and a session cache. */
const BHA_V49_TTL=10*60*1000;
const bhaV49Cache=new Map(),bhaV49Inflight=new Map();
function bhaV49Key(){const id=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);return id?`ri:${String(id)}`:'ri:portfolio'}
async function bhaV49Module(module,clientId,maxRows){
  if(!clientId)return [];
  const select='client_id,module,data,uploaded_at';
  const page=async(from,to)=>{let q=sb.from('rcm_records').select(select).eq('module',module).eq('client_id',clientId).order('uploaded_at',{ascending:false}).range(from,to);const r=await q;if(r.error)throw r.error;return r.data||[]};
  const first=await page(0,Math.min(999,maxRows-1));
  let raw=[...first];
  if(first.length===1000&&maxRows>1000){
    // Fetch remaining ranges in small concurrent waves. This removes the long 1→2→3…
    // page waterfall without creating a portfolio-wide request storm.
    const ranges=[];for(let from=1000;from<maxRows;from+=1000)ranges.push([from,Math.min(from+999,maxRows-1)]);
    for(let i=0;i<ranges.length;i+=8){
      const batch=await Promise.all(ranges.slice(i,i+8).map(r=>page(r[0],r[1])));
      for(const rows of batch){raw.push(...rows)}
      if(batch.some(rows=>rows.length<1000))break;
    }
  }
  return raw.slice(0,maxRows).map(x=>({...sanitizeStoredRecord(module,x.data),client_id:x.client_id}));
}
riFetch=async function(options={}){
  if(DEMO_MODE)return {ar:state.records?.ar||[],payments:state.records?.payments||[],denials:state.records?.denials||[],bank_deposits:state.records?.bank_deposits||[],contract_rates:state.records?.contract_rates||[],charges:state.records?.charges||[]};
  const clientId=state.client?.id||(!hasAllClients()?state.profile?.client_id:null);
  if(!clientId)return {ar:[],payments:[],denials:[],bank_deposits:[],contract_rates:[],charges:[]};
  const key=bhaV49Key(),now=Date.now();
  if(!options.force){const hit=bhaV49Cache.get(key);if(hit&&now-hit.at<BHA_V49_TTL)return hit.data;if(bhaV49Inflight.has(key))return bhaV49Inflight.get(key)}
  const task=(async()=>{
    const [ar,payments,denials,bank,contracts]=await Promise.all([
      bhaV49Module('ar',clientId,10000),bhaV49Module('payments',clientId,5000),bhaV49Module('denials',clientId,5000),
      bhaV49Module('bank_deposits',clientId,5000),bhaV49Module('contract_rates',clientId,5000)
    ]);
    const charges=contracts.length?await bhaV49Module('charges',clientId,10000):[];
    const data={ar,payments,denials,bank_deposits:bank,contract_rates:contracts,charges};bhaV49Cache.set(key,{at:Date.now(),data});return data;
  })();
  bhaV49Inflight.set(key,task);try{return await task}finally{if(bhaV49Inflight.get(key)===task)bhaV49Inflight.delete(key)}
};
function bhaV49Invalidate(clientId){if(clientId==null){bhaV49Cache.clear();return}bhaV49Cache.delete(`ri:${String(clientId)}`)}
// Keep imports fresh without changing database behavior.

return out};wrapped.__bhaV49=true;insertRecords=wrapped}
// Professional loading copy: short, neutral and production-facing.

<script id="v56-ri-fast">
/* V56 — Revenue Intelligence fast architecture.
   Forecast + payer intelligence are server-aggregated.
   Detailed payment/bank/contract rows load only when those tabs are opened. */
const BHA_V56_RI_TTL=5*60*1000;
const bhaV56RiCache=new Map();

async function bhaV56FastIntelligence(clientId,force=false){
  const key=String(clientId),now=Date.now(),hit=bhaV56RiCache.get(key);
  if(!force&&hit&&now-hit.at<BHA_V56_RI_TTL)return hit.data;
  const [s,p]=await Promise.all([
    sb.rpc('app_rcm_summary',{p_client_id:clientId}),
    sb.rpc('app_ri_payer_summary',{p_client_id:clientId})
  ]);
  if(s.error)throw s.error;if(p.error)throw p.error;
  const summary=s.data||{}, payers=(p.data||[]).map(z=>({
    payer:z.payer||'Unspecified',claims:Number(z.ar_claims||0),ar:Number(z.outstanding_ar||0),
    payments:Number(z.payments||0),paymentRecords:Number(z.payment_records||0),
    denials:Number(z.denials||0),weighted:Number(z.weighted_ar||0)
  }));
  const totalAR=Number(summary.total_ar||0), arCount=Number(summary.ar_claims||0);
  const payCount=Number(summary.payment_records||0), totalPaid=Number(summary.posted_amount||0);
  const denialExposure=Number(summary.denial_amount||0);
  const weighted=payers.reduce((a,z)=>a+z.weighted,0);
  const base=Math.min(totalAR,weighted||totalAR*.48),p30=base*.46,p60=base*.76,p90=base;
  const conf=riConfidence(arCount,payCount),spread=conf.score>=80?.08:conf.score>=55?.15:.25;
  const range=v=>({low:Math.max(0,v*(1-spread)),high:v*(1+spread)});
  const aging=Array.isArray(summary.aging)?summary.aging:[];
  const old90=aging.reduce((a,z)=>{
    const b=String(z.bucket||z.aging_bucket||'').toLowerCase();
    return a+((/91|121|181|241|365/.test(b))?Number(z.balance||z.total_balance||0):0);
  },0);
  const data={summary,payers,totalAR,totalPaid,arCount,payCount,denialExposure,weighted,p30,p60,p90,conf,r30:range(p30),r60:range(p60),r90:range(p90),old90,weekly:[p30*.22,p30*.25,p30*.27,p30*.26]};
  bhaV56RiCache.set(key,{at:now,data});return data;
}
async function bhaV56ModuleExists(module,clientId){
  const r=await sb.from('rcm_records').select('id',{count:'exact',head:true}).eq('client_id',clientId).eq('module',module);
  if(r.error)return false;return Number(r.count||0)>0;
}
function bhaV56PayerRows(x,payer=''){

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseNum(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return Number.isFinite(v)?v:null;let s=String(v).trim();if(!s||/^(n\/a|na|null|undefined|none|-)$/i.test(s))return null;const neg=/^\(.*\)$/.test(s);s=s.replace(/^\((.*)\)$/,'$1').replace(/[−–—]/g,'-').replace(/^(USD|US\$)\s*/i,'').replace(/\s*(USD|US\$)$/i,'').replace(/[$£€₹,]/g,'').replace(/\s+/g,'');const n=Number(s);return Number.isFinite(n)?(neg?-Math.abs(n):n):null}
function compact(v){if(v==null)return'—';const n=Number(v);const a=Math.abs(n);if(a>=1e6)return(n/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+'M';if(a>=1e3)return(n/1e3).toLocaleString('en-US',{maximumFractionDigits:1})+'K';return n.toLocaleString('en-US',{maximumFractionDigits:0})}
function money(v){return v==null?'—':'$'+compact(v)}
function count(v){return Number(v||0).toLocaleString()}

function sourceKeys(r){return Array.isArray(r?.__source_columns)&&r.__source_columns.length?r.__source_columns.filter(k=>k!=='client_id'&&!String(k).startsWith('__')):Object.keys(r||{}).filter(k=>k!=='client_id'&&!String(k).startsWith('__'))}
function headerLabel(r,k){return r?.__source_headers?.[k]||k}
function get(r,keys){for(const k of keys){if(r&&Object.prototype.hasOwnProperty.call(r,k)&&r[k]!==''&&r[k]!=null)return r[k];const sk=sourceKeys(r);const found=sk.find(x=>String(headerLabel(r,x)).trim().toLowerCase()===String(k).trim().toLowerCase());if(found&&r[found]!==''&&r[found]!=null)return r[found]}return null}
function has(rows,keys){return rows.some(r=>get(r,keys)!==null)}
function sum(rows,keys){let ok=false,t=0;for(const r of rows){const n=parseNum(get(r,keys));if(n!==null){ok=true;t+=n}}return ok?t:null}
function uniq(rows,keys){return [...new Set(rows.map(r=>String(get(r,keys)||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function dt(v){
 if(v===null||v===undefined||v==='')return null;
 if(v instanceof Date)return Number.isNaN(v.getTime())?null:v;
 if(typeof v==='number'){
   // Excel serial dates only. Reject ordinary years, IDs, balances and epoch-like source values.
   if(v>=20000&&v<=80000){const x=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000);return x}
   return null;
 }
 const raw=String(v).trim();
 if(!raw||/^\d{1,4}$/.test(raw)||/^\d+(\.\d+)?$/.test(raw))return null;
 let x=null;
 // ISO YYYY-MM-DD
 let m=raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s].*)?$/);
 if(m){x=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));return Number.isNaN(x.getTime())?null:x}
 // US MM/DD/YYYY or MM-DD-YYYY
 m=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(m){x=new Date(Number(m[3]),Number(m[1])-1,Number(m[2]));return Number.isNaN(x.getTime())?null:x}
 return null
}

function dateYears(rows,module){const ys=rows.map(r=>moduleDate(r,module)).filter(Boolean).map(d=>d.getFullYear());return ys.length?{min:Math.min(...ys),max:Math.max(...ys),count:ys.length}:null}
function trustworthyDateSet(rows,module){
 const ds=rows.map(r=>moduleDate(r,module)).filter(Boolean),now=new Date().getFullYear();
 if(ds.length<2)return false;
 const plausible=ds.filter(d=>d.getFullYear()>=now-3&&d.getFullYear()<=now+1);
 return plausible.length/Math.max(1,ds.length)>=.8
}

async function loadProfile(){
 const u=S.session.user;
 const p=await sb.from('profiles').select('id,name,email,role,client_id,provider_name,access_all,active').eq('id',u.id).single();
 if(p.error)throw p.error;if(!p.data?.active)throw new Error('This account is disabled.');
 S.profile=p.data;let allowed=[];
 if(!p.data.access_all){const a=await sb.from('profile_client_access').select('client_id').eq('profile_id',p.data.id);if(!a.error)allowed=(a.data||[]).map(x=>String(x.client_id));if(p.data.client_id&&!allowed.includes(String(p.data.client_id)))allowed.unshift(String(p.data.client_id))}
 const c=await sb.from('clients').select('id,name,specialty,status').order('name');if(c.error)throw c.error;
 let clients=c.data||[];if(!(role()==='admin'||p.data.access_all===true)){const set=new Set(allowed);clients=clients.filter(x=>set.has(String(x.id)))}
 S.clients=clients;S.client=clients.find(x=>String(x.id)===String(p.data.client_id))||clients[0]||null;if(!S.client)throw new Error('No practice access is assigned to this account.');
}
async function fetchModule(m){
 const id=S.client?.id;if(!id)return[];
 let rows=[],from=0,size=1000,total=Infinity;
 while(from<total){
   const q=await sb.from('rcm_records').select('client_id,module,external_id,data,uploaded_at,import_batch_id',{count:'exact'}).eq('client_id',id).eq('module',m).order('uploaded_at',{ascending:false}).range(from,from+size-1);
   if(q.error)throw q.error;total=Number(q.count??0);for(const x of q.data||[]){const d={...(x.data||{}),client_id:x.client_id,__external_id:x.external_id,__db_uploaded_at:x.uploaded_at,__source_batch_id:x.import_batch_id};rows.push(d)}if(!(q.data||[]).length)break;from+=size;
 }
 if(role()==='provider')rows=rows.filter(bhaOwnProviderRecord)
 return rows;
}

function eiStatusKind(v,type){

   if(/inactive|terminated|termed|not eligible|failed|issue|problem/.test(x))return'bad';
   if(/pending|in progress|review|unknown|unable/.test(x))return'pending';
 }else{
   if(/approved|authorized|complete/.test(x))return'good';
   if(/denied|rejected|expired/.test(x))return'bad';

}

<!-- V18 FINAL ARCHITECTURE LOCAL TEST: performance-only data transport layer. No business formulas/cards changed. -->
<script id="bha-v18-final-architecture">
(function(){
  const CACHE_TTL=10*60*1000;
  const PAGE=1000;
  const MAX_PARALLEL=6;
  const mem=new Map(), flights=new Map();
  const key=(cid,m)=>`bha_v19_scoped_${String(S?.session?.user?.id||state?.session?.user?.id||'anonymous')}_${role()}_${bhaProviderKey(S?.profile?.provider_name||'')}_${cid}_${m}`;
  const now=()=>Date.now();
  function readCache(cid,m){
    const k=key(cid,m); if(mem.has(k))return mem.get(k);
    try{const x=JSON.parse(sessionStorage.getItem(k)||'null');if(x&&x.at&&now()-x.at<CACHE_TTL&&Array.isArray(x.rows)){mem.set(k,x.rows);return x.rows}}catch(_){}
    return null;
  }
  function writeCache(cid,m,rows){
    const k=key(cid,m);mem.set(k,rows);try{sessionStorage.setItem(k,JSON.stringify({at:now(),rows}))}catch(_){}return rows;
  }
  function normalize(x){const d={...(x.data||{}),client_id:x.client_id,__external_id:x.external_id,__db_uploaded_at:x.uploaded_at,__source_batch_id:x.import_batch_id};return d}
  async function parallelMap(items,limit,fn){
    const out=new Array(items.length);let next=0;
    async function worker(){while(true){const i=next++;if(i>=items.length)return;out[i]=await fn(items[i],i)}}
    await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));return out;
  }
  async function fastModule(m,force=false){
    const cid=String(S?.client?.id||'');if(!cid)return[];
    if(!force && role()!=='provider'){const hit=readCache(cid,m);if(hit)return hit;const f=flights.get(key(cid,m));if(f)return f}
    const job=(async()=>{
      const head=await sb.from('rcm_records').select('id',{count:'exact',head:true}).eq('client_id',cid).eq('module',m);
      if(head.error)throw head.error;const total=Number(head.count||0);if(!total)return role()==='provider'?[]:writeCache(cid,m,[]);
      const starts=[];for(let from=0;from<total;from+=PAGE)starts.push(from);
      const pages=await parallelMap(starts,MAX_PARALLEL,async from=>{
        const q=await sb.from('rcm_records').select('client_id,module,external_id,data,uploaded_at,import_batch_id').eq('client_id',cid).eq('module',m).order('uploaded_at',{ascending:false}).range(from,Math.min(from+PAGE-1,total-1));
        if(q.error)throw q.error;return q.data||[];
      });
      let rows=pages.flat().map(normalize);
      if(role()==='provider')rows=rows.filter(bhaOwnProviderRecord)
      return role()==='provider'?rows:writeCache(cid,m,rows);
    })().finally(()=>flights.delete(key(cid,m)));
    flights.set(key(cid,m),job);return job;
  }
  try{fetchModule=fastModule}catch(_){window.fetchModule=fastModule}

  // Keep every locked calculation/rendering path unchanged; only transport is faster.
  // loadAll still receives the exact same six arrays, but each module now pages concurrently and is session-cached.
  const originalLoadAll=loadAll;
  loadAll=async function(force=false){
    const host=document.getElementById('content');
    if(host)host.innerHTML='<div class="loading"><div><div class="spinner"></div>Loading published practice data…</div></div>';
    const results=await Promise.all(MODS.map(async m=>{try{return[m,await fastModule(m,force)]}catch(e){console.warn('V18 module load',m,e);return[m,[]]}}));
    S.records=Object.fromEntries(results);S.__loadedProviderKey=role()==='provider'?bhaProviderKey(S.profile?.provider_name):null;return S.records;
  };

  // Client switches must never reuse another practice's in-memory records.
  const oldReset=resetLockedClientState;
  resetLockedClientState=function(){oldReset();lockedLoadPromise=null};

  // Revenue Intelligence: prefer already-loaded canonical locked rows so A/R 91+ uses the same age() rule as A/R.
  // Direct Revenue access remains on the existing aggregate RPC path and never blocks on downloading all modules.
  const priorRI=typeof bhaV56FastIntelligence==='function'?bhaV56FastIntelligence:null;
  if(priorRI){
    const alignedRI=async function(clientId,force=false){
      const x=await priorRI(clientId,force);
      try{
        if(String(S?.client?.id||'')===String(clientId)&&Array.isArray(S?.records?.ar)&&S.records.ar.length){
          const ar=S.records.ar;let total=0,old=0;const pm=new Map();
          for(const r of ar){const b=parseNum(get(r,F.balance));if(b!==null){total+=b;const a=age(r);if(a!==null&&a>90)old+=b}const pn=String(get(r,F.payer)||'').trim();if(pn){const z=pm.get(pn)||{payer:pn,claims:0,ar:0,payments:0,paymentRecords:0,denials:0,weighted:0};z.claims++;if(b!==null)z.ar+=b;pm.set(pn,z)}}
          x.totalAR=total;x.old90=old;x.arCount=ar.length;x.payers=[...pm.values()].sort((a,b)=>b.ar-a.ar);
        }
        if(String(S?.client?.id||'')===String(clientId)&&Array.isArray(S?.records?.payments)&&S.records.payments.length){
          let t=0,used=0;for(const r of S.records.payments){let v=parseNum(get(r,F.payments));if(v===null){const pp=parseNum(r['Payer Payments']??r['Payer Payment']??r.payer_payments)||0,pt=parseNum(r['Patient Payments']??r['Patient Payment']??r.patient_payments)||0;if(pp||pt)v=pp+pt}if(v!==null){t+=v;used++}}
          if(used){x.totalPaid=t;x.payCount=S.records.payments.length}
        }
      }catch(e){console.warn('V18 RI alignment skipped',e)}
      return x;
    };
    try{bhaV56FastIntelligence=alignedRI}catch(_){window.bhaV56FastIntelligence=alignedRI}
  }

  window.BHA_STABLE_QA={build:'V18_FINAL_ARCHITECTURE_LOCAL',transport:'parallel paged + session cache',calculations:'unchanged; RI aligns to locked rows when present',backendMutation:false};
})();
</script>
<script id="bha-v20-logout-hardening">
(function(){
  let busy=false;
  async function hardLogout(ev){
    if(ev){ev.preventDefault();ev.stopPropagation();}
    if(busy)return; busy=true;
    const buttons=[document.getElementById('logoutBtn'),document.getElementById('logout')].filter(Boolean);
    buttons.forEach(b=>{b.disabled=true;b.textContent='Signing out…';});
    try{ if(typeof stopProductionSync==='function')stopProductionSync(); }catch(_){}
    try{ if(typeof stopCommRealtime==='function')stopCommRealtime(); }catch(_){}
    try{ if(typeof clearRecordsCache==='function')clearRecordsCache(); }catch(_){}
    try{
      if(typeof sb!=='undefined' && sb && sb.auth){
        try{ await sb.auth.signOut({scope:'local'}); }
        catch(_){ await sb.auth.signOut(); }
      }
    }catch(e){ console.warn('Logout request failed; clearing local workspace.',e); }
    try{ sessionStorage.clear(); }catch(_){}
    try{
      if(typeof state!=='undefined' && typeof freshState==='function') state=freshState();
      if(typeof S!=='undefined') Object.assign(S,{session:null,profile:null,client:null,clients:[],records:{},section:'overview'});
    }catch(_){}
    const app=document.getElementById('app');
    if(app && typeof loginView==='function'){
      app.innerHTML=loginView();
      try{ if(typeof bindLogin==='function')bindLogin(); }catch(_){}
    }else location.reload();
    busy=false;
  }
  document.addEventListener('click',function(e){
    const b=e.target.closest && e.target.closest('#logoutBtn,#logout');
    if(b) hardLogout(e);
  },true);
  window.bhaHardLogout=hardLogout;
})();
</script>

         </div>
       </div>
       <div class="ri2-panel" data-panel="payer"><section class="ri2-card"><div class="ri2-card-head"><div><h3>Payer Intelligence</h3><p>Receivables, payments and denial activity by payer using published source values.</p></div><div class="ri2-actions"><select id="ri2Payer"><option value="">All payers</option>${x.payers.map(p=>`<option value="${esc(p.payer)}">${esc(p.payer)}</option>`).join('')}</select><button id="ri2Excel">Export Excel</button><button id="ri2Print">Print / PDF</button></div></div><div class="ri2-table-wrap"><table class="ri2-table"><thead><tr><th>Payer</th><th>AR Claims</th><th>Outstanding AR</th><th>Share of AR</th><th>Payments</th><th>Payment Records</th><th>Denials</th></tr></thead><tbody id="ri2PayerBody">${payerRows(x)}</tbody></table></div><div class="ri2-source-note"><b>Note:</b> Share of A/R is a concentration metric, not a payer performance score or collection rate.</div></section></div>
       ${showRecon?'<div class="ri2-panel" data-panel="recon"><div class="ri2-card" id="ri2Recon"><div class="ri2-empty"><b>Reconciliation loads on demand</b><span>Open this tab to compare posted payments with available bank deposit activity.</span></div></div></div>':''}
       ${showContract?'<div class="ri2-panel" data-panel="contract"><div class="ri2-card" id="ri2Contract"><div class="ri2-empty"><b>Contract intelligence loads on demand</b><span>Contract variance analysis appears only when contract terms are published.</span></div></div></div>':''}`;
     const loaded={recon:false,contract:false};
     root.querySelectorAll('.ri2-tab').forEach(btn=>btn.addEventListener('click',async()=>{
       root.querySelectorAll('.ri2-tab').forEach(b=>b.classList.toggle('active',b===btn));root.querySelectorAll('.ri2-panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===btn.dataset.tab));

<script id="bha-ri-v4-reconciled-data">
/* V4 — Revenue Intelligence uses the same source rules as the locked Overview.
   Purpose: eliminate cross-module discrepancies in payments, aging and payer exposure. */
(function(){
  const RI4_TTL=5*60*1000, RI4_CACHE=new Map();
  const BAL=['balance','ar_balance','outstanding_balance','Balance','AR Balance','Outstanding Balance'];
  const PAY=['posted_amount','payment','payments','Payments','Payer Payment','Payer Payments','payment_amount'];
  const PAYER=['payer','payer_name','Payer','insurance','Insurance','insurance_name','payor'];
  const DAYS=['days','age','Days','Age','days_outstanding'];
  const BUCKET=['bucket','aging_bucket','Bucket','Aging Bucket'];

  function n(v){
    if(v===null||v===undefined||v==='')return null;
    if(typeof v==='number')return Number.isFinite(v)?v:null;
    let s=String(v).trim(); if(!s)return null;
    const neg=/^\(.*\)$/.test(s);
    s=s.replace(/^\((.*)\)$/,'$1').replace(/[−–—]/g,'-').replace(/^(USD|US\$)\s*/i,'').replace(/\s*(USD|US\$)$/i,'').replace(/[$£€₹,]/g,'').replace(/\s+/g,'');
    const x=Number(s); return Number.isFinite(x)?(neg?-Math.abs(x):x):null;
  }
  function val(d,keys){
    for(const k of keys){
      if(d && Object.prototype.hasOwnProperty.call(d,k) && d[k]!=='' && d[k]!=null)return d[k];
      if(d){
        const kk=Object.keys(d).find(x=>String(x).trim().toLowerCase()===String(k).trim().toLowerCase());
        if(kk && d[kk]!=='' && d[kk]!=null)return d[kk];
      }
    }
    return null;
  }
  function age4(d){
    const x=n(val(d,DAYS)); if(x!==null)return x;
    const b=String(val(d,BUCKET)||'').trim().replace(/–/g,'-');
    return {'0-30':15,'31-60':45,'61-90':75,'91-120':105,'121-180':150,'181-240':210,'241-365':300,'365+':366,'120+':150}[b]??null;
  }
  async function moduleRows(module,clientId){
    // Fetch count once, then page concurrently. This is materially faster than serial 1,000-row paging.
    const head=await sb.from('rcm_records').select('id',{count:'exact',head:true}).eq('client_id',clientId).eq('module',module);
    if(head.error)throw head.error;
    const total=Number(head.count||0), size=1000;
    if(!total)return [];
    const jobs=[];
    for(let from=0;from<total;from+=size){
      jobs.push(sb.from('rcm_records').select('data').eq('client_id',clientId).eq('module',module).range(from,Math.min(from+size-1,total-1)));
    }
    const pages=await Promise.all(jobs);
    const rows=[];
    for(const p of pages){if(p.error)throw p.error; for(const r of (p.data||[]))rows.push(r.data||{})}
    return rows;
  }

  async function reconciled(clientId,force=false){
    const key=String(clientId),now=Date.now(),hit=RI4_CACHE.get(key);
    if(!force&&hit&&now-hit.at<RI4_TTL)return hit.data;

    // Server summary remains useful for denial exposure; AR + payment records are read directly
    // so Revenue Intelligence matches the locked Overview's exact source-field rules.
    const [summaryRes, ar, payments]=await Promise.all([
      sb.rpc('app_rcm_summary',{p_client_id:clientId}),
      moduleRows('ar',clientId),
      moduleRows('payments',clientId)
    ]);
    if(summaryRes.error)throw summaryRes.error;
    const summary=summaryRes.data||{};

    let totalAR=0, old90=0;
    const payerMap=new Map();
    for(const d of ar){
      const bal=n(val(d,BAL));
      if(bal!==null)totalAR+=bal;
      const a=age4(d);
      if(a!==null && a>90 && bal!==null)old90+=bal;
      const raw=String(val(d,PAYER)||'').trim();
      // Blank payer values are not converted into a fake "Unspecified" top payer.
      if(raw){
        const cur=payerMap.get(raw)||{payer:raw,claims:0,ar:0,payments:0,paymentRecords:0,denials:0,weighted:0};
        cur.claims+=1; if(bal!==null)cur.ar+=bal; payerMap.set(raw,cur);
      }
    }

    let totalPaid=0;
    for(const d of payments){
      const x=n(val(d,PAY)); if(x!==null)totalPaid+=x;
    }

    const payers=[...payerMap.values()].sort((a,b)=>b.ar-a.ar);
    const denialExposure=Number(summary.denial_amount||0);
    const data={
      summary,payers,totalAR,totalPaid,
      arCount:ar.length,payCount:payments.length,
      denialExposure,old90,
      weighted:0,p30:0,p60:0,p90:0,
      conf:{label:'Not available',score:0},
      r30:{low:0,high:0},r60:{low:0,high:0},r90:{low:0,high:0},weekly:[]
    };
    RI4_CACHE.set(key,{at:now,data});
    return data;
  }

  try{ bhaV56FastIntelligence=reconciled; }catch(e){ window.bhaV56FastIntelligence=reconciled; }
  window.BHA_REVENUE_INTELLIGENCE_BUILD='RI_V4_RECONCILED_LOCKED_LOGIC';
})();
</script>

<script id="bha-ri-v6-eof-final">
(function(){

<script id="bha-ri-v8-payment-source-fix">
(function(){
  const previous = (typeof bhaV56FastIntelligence==='function') ? bhaV56FastIntelligence : null;
  if(!previous) return;

  function num(v){
    if(v===null||v===undefined||v==='') return null;
    if(typeof v==='number') return Number.isFinite(v)?v:null;
    let s=String(v).trim(); if(!s) return null;
    const neg=/^\(.*\)$/.test(s);
    s=s.replace(/^\((.*)\)$/,'$1').replace(/[−–—]/g,'-').replace(/^(USD|US\$)\s*/i,'').replace(/\s*(USD|US\$)$/i,'').replace(/[$£€₹,]/g,'').replace(/\s+/g,'');
    const n=Number(s); return Number.isFinite(n)?(neg?-Math.abs(n):n):null;
  }
  function pick(row,names){
    if(!row) return null;
    for(const name of names){
      if(Object.prototype.hasOwnProperty.call(row,name) && row[name]!=='' && row[name]!=null) return row[name];
      const k=Object.keys(row).find(x=>String(x).trim().toLowerCase()===String(name).trim().toLowerCase());
      if(k && row[k]!=='' && row[k]!=null) return row[k];
    }
    return null;
  }
  function paymentAmount(row){
    let v=pick(row,['Payments','payments','posted_amount','Posted Amount','payment_amount','Payment Amount','payment','Paid Amount']);
    let n=num(v);
    if(n!==null) return n;
    const pp=num(pick(row,['Payer Payments','Payer Payment','payer_payments','payer_payment']))||0;
    const pt=num(pick(row,['Patient Payments','Patient Payment','patient_payments','patient_payment']))||0;
    return (pp||pt)?pp+pt:null;
  }
  async function canonicalPaymentTotal(clientId){
    try{
      const rows=await bhaV49Module('payments',clientId,5000);
      let total=0, usable=0;
      for(const r of rows){ const a=paymentAmount(r); if(a!==null){total+=a; usable++;} }
      return {rows,total,usable};
    }catch(e){ return {rows:[],total:0,usable:0,error:e}; }
  }

  const upgraded = async function(clientId,force=false){
    const x=await previous(clientId,force);
    const p=await canonicalPaymentTotal(clientId);
    if(p.rows.length){
      x.payCount=p.rows.length;
      if(p.usable>0) x.totalPaid=p.total;
      x.paymentAmountUsable=p.usable>0;
      x.paymentAmountRows=p.usable;
    }
    return x;
  };
  try{ bhaV56FastIntelligence=upgraded; }catch(e){ window.bhaV56FastIntelligence=upgraded; }
  window.BHA_REVENUE_INTELLIGENCE_BUILD='RI_V8_PAYMENT_RECONCILED';

  if(window.state && state.section==='intelligence' && typeof renderRevenueIntelligence==='function'){
    setTimeout(()=>renderRevenueIntelligence(),0);
  }
})();
</script>

<script id="bha-v17-stable-performance">
(function(){
  const RI_TTL=10*60*1000, EXIST_TTL=10*60*1000;
  const riMem=new Map(), riFlight=new Map(), existsMem=new Map();
  const ssKey=id=>'bha_v17_ri_rpc_'+id;
  const toNum=v=>Number(v||0);
  function readRI(id){
    if(riMem.has(id))return riMem.get(id);
    try{const x=JSON.parse(sessionStorage.getItem(ssKey(id))||'null');if(x&&x.at&&Date.now()-x.at<RI_TTL&&x.data){riMem.set(id,x.data);return x.data}}catch(_){}
    return null;
  }
  function writeRI(id,data){riMem.set(id,data);try{sessionStorage.setItem(ssKey(id),JSON.stringify({at:Date.now(),data}))}catch(_){}return data}
  function bucketOld90(aging){return (Array.isArray(aging)?aging:[]).reduce((sum,z)=>{
    const b=String(z?.bucket||z?.aging_bucket||'').trim().toLowerCase();
    return sum+((b==='91-120'||b==='121-180'||b==='181-240'||b==='241-365'||b==='365+'||b==='365 +')?toNum(z?.balance||z?.total_balance):0);
  },0)}
  async function fastRevenue(clientId,force=false){
    const id=String(clientId||''); if(!id)throw new Error('Practice is not selected.');
    if(!force){const hit=readRI(id);if(hit)return hit;if(riFlight.has(id))return riFlight.get(id)}
    const job=(async()=>{
      const [s,p]=await Promise.all([
        sb.rpc('app_rcm_summary',{p_client_id:clientId}),
        sb.rpc('app_ri_payer_summary',{p_client_id:clientId})
      ]);
      if(s.error)throw s.error;if(p.error)throw p.error;
      const summary=s.data||{}, aging=Array.isArray(summary.aging)?summary.aging:[];
      const payers=(p.data||[]).map(z=>({
        payer:z.payer||'Unspecified',claims:toNum(z.ar_claims),ar:toNum(z.outstanding_ar),
        payments:toNum(z.payments),paymentRecords:toNum(z.payment_records),denials:toNum(z.denials),weighted:toNum(z.weighted_ar)
      })).filter(z=>z.payer&&z.ar>=0).sort((a,b)=>b.ar-a.ar);
      const data={summary,payers,totalAR:toNum(summary.total_ar),totalPaid:toNum(summary.posted_amount),
        arCount:toNum(summary.ar_claims),payCount:toNum(summary.payment_records),denialExposure:toNum(summary.denial_amount),
        old90:bucketOld90(aging),weighted:0,p30:0,p60:0,p90:0,conf:{label:'Not available',score:0},
        r30:{low:0,high:0},r60:{low:0,high:0},r90:{low:0,high:0},weekly:[]};
      return writeRI(id,data);
    })().finally(()=>riFlight.delete(id));
    riFlight.set(id,job);return job;
  }
  try{bhaV56FastIntelligence=fastRevenue}catch(_){window.bhaV56FastIntelligence=fastRevenue}

  const baseExists=typeof bhaV56ModuleExists==='function'?bhaV56ModuleExists:null;
  if(baseExists){
    const cachedExists=async function(module,clientId){
      const k=String(clientId||'')+'|'+String(module||''), hit=existsMem.get(k);
      if(hit&&Date.now()-hit.at<EXIST_TTL)return hit.value;
      const value=await baseExists(module,clientId);existsMem.set(k,{at:Date.now(),value});return value;
    };
    try{bhaV56ModuleExists=cachedExists}catch(_){window.bhaV56ModuleExists=cachedExists}
  }

  // Keep Overview canonical. It already paints its 10-minute local cache immediately and refreshes silently.
  // Crucially, V17 performs no background Supabase requests on page load, avoiding request contention/loops.
  window.BHA_STABLE_QA={build:'V17_STABLE_QA_SPEED',revenue:'RPC aggregate + session cache',overview:'existing server summary + 10m cache',prewarm:false};
})();
</script>
