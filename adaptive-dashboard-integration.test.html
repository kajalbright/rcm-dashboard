<!doctype html><meta charset="utf-8"><title>BHA Adaptive Integration Tests</title><pre id="out"></pre><script src="adaptive-dashboard-engine.js"></script><script src="adaptive-dashboard-runtime.js"></script><script>
const out=document.querySelector('#out');let pass=0,fail=0;function t(n,f){try{f();out.textContent+='PASS '+n+'\n';pass++}catch(e){out.textContent+='FAIL '+n+': '+e.message+'\n';fail++}}function eq(a,b){if(a!==b)throw Error(a+' !== '+b)}
const redwood=BHAAdaptiveRuntime.buildClientModel({ar:[{claim_id:'R1',balance:1000,bucket:'91-120'},{claim_id:'R2',balance:500,bucket:'0-30'}],charges:[{claim_id:'R1',charge:1800}]});
const demo=BHAAdaptiveRuntime.buildClientModel({ar:[{claim_id:'D1',balance:100}],payments:[{payment_id:'P1',posted_amount:75}],denials:[{claim_id:'D1',denial_description:'CO-16',denial_amount:100}]});
const empty=BHAAdaptiveRuntime.buildClientModel({verification:[{patient:'A',eligibility:'Active'}]});
t('Redwood AR supported',()=>eq(redwood.metrics.outstandingAR.state,'available'));
t('Redwood payments unavailable',()=>eq(redwood.metrics.collections.state,'unavailable'));
t('Demo collections supported',()=>eq(demo.metrics.collections.state,'available'));
t('Demo denial amount supported',()=>eq(demo.metrics.deniedAmount.state,'available'));
t('Verification-only client does not invent AR',()=>eq(empty.metrics.outstandingAR.state,'unavailable'));
const all=BHAAdaptiveRuntime.buildAllClients([redwood,demo,empty]);t('Portfolio AR reports 2/3 coverage',()=>eq(all.metrics.outstandingAR.reportingClients,2));t('Portfolio collections reports 1/3 coverage',()=>eq(all.metrics.collections.reportingClients,1));
out.textContent+='\n'+pass+' passed, '+fail+' failed\n';
</script>
